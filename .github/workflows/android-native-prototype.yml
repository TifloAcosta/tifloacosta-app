name: Verify standalone Android native prototype

on:
  push:
    branches:
      - "feature/android-native-compose-prototype-*"
    paths:
      - "android-native-prototype/**"
      - ".github/workflows/android-native-prototype.yml"
  pull_request:
    paths:
      - "android-native-prototype/**"
      - ".github/workflows/android-native-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Install standalone Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Unit tests and debug APK only
        run: gradle --no-daemon -p android-native-prototype :app:testDebugUnitTest :app:assembleDebug
      - name: Upload native prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: TifloAcosta-Nativa-Pruebas
          path: android-native-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
