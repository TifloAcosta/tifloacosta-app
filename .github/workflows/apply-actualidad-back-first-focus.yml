name: Apply Actualidad back-first focus

on:
  push:
    branches:
      - feature/actualidad-back-first-focus
    paths:
      - .github/trigger-actualidad-back-first-focus
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/actualidad-back-first-focus
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-actualidad-back-first-focus.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad-core.js
          git commit -m "fix: enfocar Volver al entrar en Actualidad"
          git push origin HEAD:feature/actualidad-back-first-focus
