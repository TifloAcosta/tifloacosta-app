name: Apply Actualidad home patch

on:
  push:
    branches:
      - feature/actualidad-web
    paths:
      - 'scripts/apply-actualidad-home.mjs'
      - 'scripts/patch-regression-actualidad.mjs'
      - '.github/workflows/apply-actualidad-home.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/actualidad-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply home patch
        run: node scripts/apply-actualidad-home.mjs
      - name: Update regression expectation
        run: node scripts/patch-regression-actualidad.mjs
      - name: Run tests
        run: npm test
      - name: Commit changed public files
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.html app.js test/regression.test.mjs)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js test/regression.test.mjs
          git commit -m "feat: preview Actualidad on home"
          git push origin HEAD:feature/actualidad-web
