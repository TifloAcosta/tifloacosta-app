name: Apply Actualidad native links fix

on:
  push:
    branches:
      - fix/actualidad-native-hash-links
    paths:
      - .github/trigger-actualidad-native-links

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/actualidad-native-hash-links
      - name: Remove Actualidad link upgrading selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('actualidad-core.js')
          text = path.read_text()
          old = "    '#actualidad-sections a.button-link',\n    '#media-sections a.button-link',\n"
          if old not in text:
              raise SystemExit('Expected selector block not found')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad-core.js
          git commit -m "fix: conservar enlaces hash nativos en Actualidad"
          git push origin HEAD:fix/actualidad-native-hash-links
