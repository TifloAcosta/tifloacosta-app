name: Apply download launcher order fix

on:
  push:
    branches:
      - 'fix/download-before-videos'
    paths:
      - '.github/workflows/apply-download-order-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/download-before-videos
      - name: Insert downloads before Videos
        shell: python
        run: |
          from pathlib import Path
          path = Path('downloads.js')
          text = path.read_text(encoding='utf-8')
          old = """    nav.append(launcher);"""
          new = """    const videosLauncher = document.getElementById('home-open-videos');
    if (videosLauncher && videosLauncher.parentElement === nav) nav.insertBefore(launcher, videosLauncher);
    else nav.append(launcher);"""
          if old not in text:
              raise SystemExit('Expected launcher insertion was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "TifloAcosta CI"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add downloads.js
          git commit -m "fix: place downloads before videos"
          git push origin HEAD:fix/download-before-videos
