name: Apply final reading beta review patch

on:
  push:
    branches:
      - feature/leer-tifloacosta-android-foundation
    paths:
      - mobile/tools/apply-reading-final-review.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage final reading review patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v5
        with:
          ref: feature/leer-tifloacosta-android-foundation
          fetch-depth: 0

      - name: Apply reviewed source changes
        run: python3 mobile/tools/apply-reading-final-review.py

      - name: Commit reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/screens/reading-book.mjs mobile/src/screens/reading-settings.mjs mobile/src/screens/reading-library.mjs mobile/src/screens/reading-audio.mjs mobile/src/core/reading-audio.mjs mobile/src/styles.css mobile/test/reading-audio.test.mjs
          git diff --cached --check
          git commit -m "fix: close reading beta review gaps"
          git push origin HEAD:feature/leer-tifloacosta-android-foundation
