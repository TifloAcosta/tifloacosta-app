name: Auditoría ortográfica accesible TifloAcosta

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/audit-ortografia.py'
      - '.github/workflows/audit-ortografia.yml'
      - 'docs/**'
      - 'ios-app-native/Sources/**'
      - 'android-native-prototype/app/src/main/**'
      - 'mobile/src/**'
      - 'data.js'
      - 'videos.json'
      - 'actualidad-media.json'
      - 'actualidad-sources.json'
      - 'mobile/release/**'
      - 'app.js'
      - 'index.html'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ortografia:
    name: Examinar textos visibles, títulos y etiquetas accesibles
    runs-on: ubuntu-latest
    steps:
      - name: Obtener la rama principal
        uses: actions/checkout@v4
      - name: Analizar textos
        run: python3 scripts/audit-ortografia.py --check
      - name: Guardar informe de hallazgos
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ortografia
          path: auditoria-ortografia.json
          retention-days: 30
      - name: Obtener la rama única de la próxima aplicación
        uses: actions/checkout@v4
        with:
          ref: development/next-public-1.6-500200-20261121
          path: app-base
      - name: Auditar también el código de la futura actualización móvil
        env:
          TIFLO_AUDIT_ROOT: ${{ github.workspace }}/app-base
        run: python3 scripts/audit-ortografia.py
      - name: Guardar el informe móvil sin modificar el código
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-ortografia-app
          path: app-base/auditoria-ortografia.json
          retention-days: 30
