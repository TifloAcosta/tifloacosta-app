name: Bootstrap TifloAcosta Android

on:
  push:
    branches:
      - main
      - 'feature/leer-tifloacosta-android-foundation'
    paths:
      - 'mobile/**'
      - '.github/workflows/bootstrap-mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/bootstrap-mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run repository regression tests
        run: npm test

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Build mobile web bundle
        working-directory: mobile
        run: npm run build --if-present

      - name: Add and synchronize Android
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Run Android unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare Android release signing when secrets are configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_SECRET: ${{ secrets.TIFLOACOSTA_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.TIFLOACOSTA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64_SECRET" ] && [ -z "$ANDROID_KEYSTORE_PASSWORD_SECRET" ]; then
            echo "Android signing secrets are not configured; producing validation builds."
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64_SECRET" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD_SECRET" ]; then
            echo "Android signing secrets are incomplete. Configure both TifloAcosta signing secrets."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/tifloacosta-upload.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64_SECRET" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          mapfile -t private_key_aliases < <(
            keytool -list -v \
              -J-Duser.language=en -J-Duser.country=US \
              -storetype PKCS12 \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD_SECRET" 2>/dev/null |
            awk -F': ' '
              /^Alias name: / { alias=$2 }
              /^Entry type: PrivateKeyEntry/ { print alias }
            '
          )

          if [ "${#private_key_aliases[@]}" -ne 1 ]; then
            echo "Expected exactly one private-key entry in the Android upload keystore; found ${#private_key_aliases[@]}."
            exit 1
          fi
          android_key_alias="${private_key_aliases[0]}"

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
            echo "ANDROID_KEY_ALIAS=$android_key_alias"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build Android debug APK and release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug bundleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying after a short delay."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Verify signed Android release bundle
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ]; then
            echo "Android signing secrets are not configured; skipping signed AAB verification."
            exit 0
          fi
          if [ ! -f "$aab" ]; then
            echo "Release AAB not found at $aab"
            exit 1
          fi
          jarsigner -verify "$aab"
          echo "Verified signed Android release bundle at $aab"

      - name: Verify merged Android notification manifest
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          merged_manifest="$(find app/build/intermediates/merged_manifests -type f -name AndroidManifest.xml -print -quit)"
          if [ -z "$merged_manifest" ]; then
            echo "Merged AndroidManifest.xml not found under app/build/intermediates/merged_manifests."
            exit 1
          fi
          grep -Fq 'android.permission.POST_NOTIFICATIONS' "$merged_manifest"
          grep -Fq 'com.onesignal' "$merged_manifest"
          echo "Verified native OneSignal notification wiring in $merged_manifest"

      - name: Upload Android validation builds
        uses: actions/upload-artifact@v4
        with:
          name: tifloacosta-android-validation
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
