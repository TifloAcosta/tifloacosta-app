name: Bootstrap TifloAcosta Android

on:
  push:
    branches:
      - feature/mobile-capacitor-foundation
    paths:
      - 'mobile/package.json'
      - 'mobile/capacitor.config.json'
      - '.github/workflows/bootstrap-mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip mobile-bootstrap]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/mobile-capacitor-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run repository regression tests
        run: npm test

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Build mobile web bundle
        working-directory: mobile
        run: npm run build --if-present

      - name: Add and synchronize Android
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android debug APK and release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Android validation builds
        uses: actions/upload-artifact@v4
        with:
          name: tifloacosta-android-validation
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Commit generated Android project and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android
          if git diff --cached --quiet; then
            echo "Android project is already synchronized."
            exit 0
          fi
          git commit -m "chore: bootstrap Capacitor Android [skip mobile-bootstrap]"
          git push origin HEAD:feature/mobile-capacitor-foundation
