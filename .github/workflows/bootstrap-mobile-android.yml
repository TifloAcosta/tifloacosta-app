name: Bootstrap TifloAcosta Android

on:
  push:
    branches:
      - feature/mobile-capacitor-foundation
    paths:
      - 'mobile/package.json'
      - 'mobile/capacitor.config.json'
      - 'mobile/scripts/**'
      - 'mobile/src/**'
      - 'mobile/test/**'
      - 'mobile/android/**'
      - '.github/workflows/bootstrap-mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip mobile-bootstrap]') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/mobile-capacitor-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run repository regression tests
        run: npm test

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Build mobile web bundle
        working-directory: mobile
        run: npm run build --if-present

      - name: Add and synchronize Android
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android release signing when secrets are configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          values=(
            "$ANDROID_KEYSTORE_BASE64_SECRET"
            "$ANDROID_KEYSTORE_PASSWORD_SECRET"
            "$ANDROID_KEY_ALIAS_SECRET"
            "$ANDROID_KEY_PASSWORD_SECRET"
          )
          configured=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "Android signing secrets are not configured; producing validation builds."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "Android signing secrets are incomplete. Configure all four signing secrets."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/android-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64_SECRET" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build Android debug APK and release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug bundleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build attempt $attempt failed; retrying after a short delay."
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Upload Android validation builds
        uses: actions/upload-artifact@v4
        with:
          name: tifloacosta-android-validation
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Commit generated Android project and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android
          if git diff --cached --quiet; then
            echo "Android project is already synchronized."
            exit 0
          fi
          git commit -m "chore: bootstrap Capacitor Android [skip mobile-bootstrap]"
          git push origin HEAD:feature/mobile-capacitor-foundation
