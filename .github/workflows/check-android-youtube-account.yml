name: Verify Android Google YouTube account

on:
  pull_request:
    paths:
      - 'mobile/src/screens/videos.mjs'
      - 'mobile/src/screens/youtube-account.mjs'
      - 'mobile/src/native/youtube-account-plugin.mjs'
      - 'mobile/android/app/src/main/AndroidManifest.xml'
      - 'mobile/android/app/src/main/java/com/tifloacosta/app/MainActivity.java'
      - 'mobile/android/app/src/main/java/com/tifloacosta/app/TifloYouTubeAccountPlugin.java'
      - 'mobile/test/android-youtube-account.test.mjs'
      - '.github/workflows/check-android-youtube-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Validate Android YouTube account, existing video player and home
        working-directory: mobile
        run: node --test test/android-youtube-account.test.mjs test/android-resources-youtube-parity.test.mjs test/videos-accessible-player.test.mjs test/video-screen-awake.test.mjs test/android-start-experience.test.mjs
      - name: Build and synchronize Capacitor Android
        working-directory: mobile
        run: |
          npm run build
          npx cap sync android
      - name: Compile debug APK without signing, publishing or touching Google Play
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest -PtifloSafeDebug --stacktrace
      - name: Upload isolated Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: TifloAcosta-Android-Google-Pruebas
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/debug/*.apk
