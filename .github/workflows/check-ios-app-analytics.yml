name: Comprobar acceso a estadísticas App Store desde ChatGPT
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_ID: ${{ secrets.APPSTORE_ANALYTICS_KEY_ID }}
      API_ISSUER: ${{ secrets.APPSTORE_ANALYTICS_ISSUER_ID }}
      API_PRIVATE: ${{ secrets.APPSTORE_ANALYTICS_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apple-chat-commands
      - name: Avisar de credenciales analíticas pendientes
        if: env.API_ID == '' || env.API_ISSUER == '' || env.API_PRIVATE == ''
        run: echo 'PENDIENTE - configurar clave de estadísticas Apple en los secretos protegidos de GitHub.'
      - name: Consultar disponibilidad de informes sin modificar Apple
        if: env.API_ID != '' && env.API_ISSUER != '' && env.API_PRIVATE != ''
        run: node .github/scripts/apple-analytics-access-probe.mjs
      - name: Descargar y verificar segmentos de informes con credenciales permanentes
        if: env.API_ID != '' && env.API_ISSUER != '' && env.API_PRIVATE != ''
        run: node .github/scripts/apple-analytics-catalog.mjs
      - name: Verificar solicitud ONGOING con la clave permanente
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          try {
            for (const name of ['API_ID','API_ISSUER','API_PRIVATE']) {
              if (!process.env[name]) throw new Error('Faltan credenciales permanentes de Analytics.');
            }
            let key = process.env.API_PRIVATE.trim().replace(/^['"]|['"]$/g,'').replace(/\\r\\n/g,'\n').replace(/\\n/g,'\n');
            if (!key.includes('-----BEGIN')) key = Buffer.from(key,'base64').toString('utf8');
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const message = encode({alg:'ES256',kid:process.env.API_ID,typ:'JWT'})+'.'+encode({iss:process.env.API_ISSUER,iat:now-30,exp:now+600,aud:'appstoreconnect-v1'});
            const token = message+'.'+crypto.sign('sha256',Buffer.from(message),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
            const id = 'b26b6c8c-d699-48b1-8b62-cd66071c81ee';
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/analyticsReportRequests/'+id,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(45000)});
            if (response.status !== 200) throw new Error('Apple HTTP '+response.status);
            const {data} = await response.json();
            if (data?.id !== id || data.attributes?.accessType !== 'ONGOING' || data.attributes?.stoppedDueToInactivity !== false) throw new Error('La solicitud indicada no está activa.');
            const output = JSON.stringify({requestId:data.id,accessType:data.attributes.accessType,stoppedDueToInactivity:data.attributes.stoppedDueToInactivity,verifiedWith:'TifloAcosta Analytics',verifiedAt:new Date().toISOString()},null,2);
            console.log(output);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Comprobación de la solicitud periódica\n\n~~~json\n'+output+'\n~~~\n');
          } catch (error) {
            console.error(/^(Apple HTTP|Faltan credenciales|La solicitud)/.test(error.message) ? error.message : 'No se pudo verificar Analytics; las credenciales no se muestran.');
            process.exitCode = 1;
          }
          NODE
