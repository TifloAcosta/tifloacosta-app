name: Consultar reseñas de TifloAcosta en App Store
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, apple-chat-commands]
    paths:
      - '.github/workflows/check-ios-appstore-reviews.yml'
      - 'apple-chat-requests/*.json'
permissions:
  contents: read
jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      API_PRIVATE: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar interpretación de las respuestas
        run: node --test .github/scripts/appstore-reviews.test.mjs
      - name: Consultar reseñas y respuestas sin publicar nada
        run: node .github/scripts/appstore-reviews.mjs
