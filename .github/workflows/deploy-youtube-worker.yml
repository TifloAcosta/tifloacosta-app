name: Deploy YouTube actions worker

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/youtube-deploy'
    paths:
      - 'youtube-worker/**'
      - '.github/workflows/deploy-youtube-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker tooling
        working-directory: youtube-worker
        run: npm install --no-audit --no-fund

      - name: Run YouTube Worker tests
        working-directory: youtube-worker
        run: npm test

      - name: Deploy YouTube actions Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: youtube-worker
          command: deploy

      - name: Configure Google OAuth secrets when available
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_SESSION_SECRET: ${{ secrets.YOUTUBE_SESSION_SECRET }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$YOUTUBE_SESSION_SECRET" ]; then
            echo 'Google OAuth secrets are not all configured yet. The Worker is deployed, but authenticated YouTube actions remain disabled.'
            exit 0
          fi

          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$YOUTUBE_SESSION_SECRET" | npx wrangler secret put YOUTUBE_SESSION_SECRET

      - name: Smoke test YouTube Worker health
        shell: bash
        run: |
          status=$(curl -sS -o health.json -w "%{http_code}" \
            https://youtube-auth.tifloacosta.com/health)
          cat health.json
          test "$status" = "200"
          grep -q '"service":"youtube-actions"' health.json
