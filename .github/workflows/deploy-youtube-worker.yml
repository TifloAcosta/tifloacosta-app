name: Deploy YouTube actions worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'youtube-worker/**'
      - '.github/workflows/deploy-youtube-worker.yml'
  workflow_dispatch:
  push:
    branches:
      - 'feature/youtube-actions'
      - 'main'
    paths:
      - 'youtube-worker/**'
      - '.github/workflows/deploy-youtube-worker.yml'

permissions:
  contents: read

concurrency:
  group: youtube-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development/next-public-1.6-500200-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and bundle the Worker locally
        working-directory: youtube-worker
        run: |
          npm install --no-audit --no-fund
          npm test
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/youtube-worker"
      - name: Read active deployments and confirm required secrets
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler deployments list
          npx --no-install wrangler secret list > "$RUNNER_TEMP/youtube-worker-secrets.json"
          jq -e 'map(.name) | contains(["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "YOUTUBE_SESSION_SECRET", "YOUTUBE_API_KEY"])' "$RUNNER_TEMP/youtube-worker-secrets.json"

      - name: Upload candidate, verify configuration, deploy and test with rollback
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          
          const apiBase = 'https://api.cloudflare.com/client/v4/accounts/' +
            process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/tifloacosta-youtube-actions';
          const origin = 'https://tifloacosta.com';
          const production = 'https://youtube-auth.tifloacosta.com';
          async function api(path, body) {
            const response = await fetch(apiBase + path, {
              method: body ? 'POST' : 'GET',
              headers: {
                Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
                'Content-Type': 'application/json'
              },
              body: body && JSON.stringify(body),
              signal: AbortSignal.timeout(20000)
            });
            const result = await response.json();
            assert(response.ok && result.success, path + ' HTTP ' + response.status +
              ' Cloudflare codes ' + result.errors?.map(error => error.code).join(','));
            return result.result;
          }
          async function active() {
            const {deployments} = await api('/deployments');
            const latest = deployments.sort((a, b) => b.created_on.localeCompare(a.created_on))[0];
            assert(latest.versions.length === 1 && latest.versions[0].percentage === 100);
            return latest.versions[0].version_id;
          }
          async function settings(id) {
            const {resources} = await api('/versions/' + id);
            const bindings = resources.bindings.map(({name, type, text}) =>
              type === 'plain_text' ? {name, type, text} : {name, type});
            for (const name of ['GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET','YOUTUBE_SESSION_SECRET','YOUTUBE_API_KEY']) {
              assert(bindings.some(binding => binding.name === name && binding.type === 'secret_text'), name);
            }
            return {
              bindings: bindings.sort((a, b) => a.name.localeCompare(b.name)),
              compatibilityDate: resources.script_runtime.compatibility_date,
              compatibilityFlags: resources.script_runtime.compatibility_flags ?? []
            };
          }
          async function request(base, path, query = {}, expected = 200, from = origin) {
            const url = new URL(path, base);
            url.search = new URLSearchParams(query);
            const response = await fetch(url, {
              headers: {Origin: from}, signal: AbortSignal.timeout(20000)
            });
            assert.equal(response.status, expected, path + ' ' + JSON.stringify(query));
            assert.equal(response.headers.get('access-control-allow-origin'), from === origin ? origin : null);
            return response.json();
          }
          async function smoke(base) {
            assert.equal((await request(base, '/health')).service, 'youtube-actions');
            const search = (filter, q = 'TifloAcosta') => request(base, '/search', {q, filter});
            const videos = await search('video');
            assert(videos.items.length && videos.items.every(item => item.kind === 'video'));
            const channels = await search('channel');
            const channelId = channels.items.find(item => item.kind === 'channel' && item.channelId)?.channelId;
            assert(channelId);
            for (const q of ['', 'TifloAcosta']) {
              const page = await request(base, '/channel-videos', {channelId, q});
              assert(Array.isArray(page.items) && page.items.every(item => item.kind === 'video'));
              if (!q) assert(page.items.length);
            }
            assert((await search('all')).items.length);
            const playlists = await search('playlist', 'TED Talks TED');
            assert(playlists.items.length && playlists.items.every(item => item.kind === 'playlist' && item.playlistId));
            let paginated = false;
            for (const {playlistId} of playlists.items.slice(0, 5)) {
              const first = await request(base, '/playlist-items', {playlistId});
              if (!first.items.length || !first.nextPageToken) continue;
              const second = await request(base, '/playlist-items', {playlistId, pageToken: first.nextPageToken});
              assert(second.items.length);
              const items = [...first.items, ...second.items];
              assert(items.every((item, i) => item.title && /^[\w-]{11}$/.test(item.id) &&
                Number.isInteger(item.position) && (i === 0 || item.position > items[i - 1].position)));
              console.log('Playlist checked:', playlistId, 'page sizes', first.items.length, second.items.length);
              paginated = true;
              break;
            }
            assert(paginated, 'No public playlist had two nonempty pages');
            assert.equal((await request(base, '/playlist-items', {playlistId: '!'}, 400)).error, 'INVALID_PLAYLIST');
            assert.equal((await request(base, '/playlist-items', {}, 403, 'https://example.invalid')).error, 'ORIGIN_NOT_ALLOWED');
            if (base === production) {
              const oauth = await fetch(new URL('/auth/start', base), {redirect: 'manual', signal: AbortSignal.timeout(20000)});
              assert.equal(oauth.status, 302);
              assert.equal(new URL(oauth.headers.get('location')).hostname, 'accounts.google.com');
            }
          }
          const previous = await active();
          const before = await settings(previous);
          console.log('Previous production version:', previous);
          const output = process.env.RUNNER_TEMP + '/youtube-worker-upload.jsonl';
          execFileSync('npx', ['--no-install', 'wrangler', 'versions', 'upload'], {
            stdio: 'inherit', env: {...process.env, WRANGLER_OUTPUT_FILE_PATH: output}
          });
          const upload = readFileSync(output, 'utf8').trim().split('\n').map(JSON.parse)
            .find(entry => entry.type === 'version-upload');
          const candidate = upload?.version_id;
          assert.match(candidate ?? '', /^[\da-f-]{36}$/i);
          assert.notEqual(candidate, previous);
          console.log('Candidate version:', candidate);
          assert.deepEqual(await settings(candidate), before, 'Candidate runtime configuration differs');
          const preview = upload.preview_url || upload.preview_urls?.find(url => typeof url === 'string');
          if (preview && new URL(preview).hostname.endsWith('.workers.dev')) await smoke(preview);
          assert.equal(await active(), previous, 'Production changed during preparation');
          const switchTo = version_id => api('/deployments', {strategy: 'percentage', versions: [{version_id, percentage: 100}]});
          try {
            await switchTo(candidate);
            assert.equal(await active(), candidate);
            await smoke(production);
            console.log('Production smoke tests passed for', candidate);
          } catch (error) {
            const current = await active();
            if (current === candidate) {
              await switchTo(previous);
              assert.equal(await active(), previous);
              const health = await request(production, '/health');
              assert.equal(health.service, 'youtube-actions');
              console.log('Rollback verified:', previous);
            }
            throw error;
          }
          NODE

  deploy:
    if: github.ref != 'refs/heads/development/next-public-1.6-500200-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker tooling
        working-directory: youtube-worker
        run: npm install --no-audit --no-fund

      - name: Run YouTube Worker tests
        working-directory: youtube-worker
        run: npm test

      - name: Deploy YouTube actions Worker
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: youtube-worker
          command: deploy

      - name: Configure Google OAuth secrets
        if: github.event_name != 'pull_request'
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_SESSION_SECRET: ${{ secrets.YOUTUBE_SESSION_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$YOUTUBE_SESSION_SECRET"
          test -n "$YOUTUBE_API_KEY"
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$YOUTUBE_SESSION_SECRET" | npx wrangler secret put YOUTUBE_SESSION_SECRET
          printf '%s' "$YOUTUBE_API_KEY" | npx wrangler secret put YOUTUBE_API_KEY

      - name: Smoke test YouTube Worker health
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          status=$(curl -sS -o health.json -w "%{http_code}" \
            https://youtube-auth.tifloacosta.com/health)
          cat health.json
          test "$status" = "200"
          grep -q '"service":"youtube-actions"' health.json
