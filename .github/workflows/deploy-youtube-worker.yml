name: Deploy YouTube actions worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'youtube-worker/**'
      - '.github/workflows/deploy-youtube-worker.yml'
  workflow_dispatch:
  push:
    branches:
      - 'feature/youtube-actions'
      - 'main'
    paths:
      - 'youtube-worker/**'
      - '.github/workflows/deploy-youtube-worker.yml'

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development/next-public-1.6-500200-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and bundle the Worker locally
        working-directory: youtube-worker
        run: |
          npm install --no-audit --no-fund
          npm test
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/youtube-worker"
      - name: Read active deployments and confirm required secrets
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler deployments list
          npx --no-install wrangler secret list > "$RUNNER_TEMP/youtube-worker-secrets.json"
          jq -e 'map(.name) | contains(["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "YOUTUBE_SESSION_SECRET", "YOUTUBE_API_KEY"])' "$RUNNER_TEMP/youtube-worker-secrets.json"

  deploy:
    if: github.ref != 'refs/heads/development/next-public-1.6-500200-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker tooling
        working-directory: youtube-worker
        run: npm install --no-audit --no-fund

      - name: Run YouTube Worker tests
        working-directory: youtube-worker
        run: npm test

      - name: Deploy YouTube actions Worker
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: youtube-worker
          command: deploy

      - name: Configure Google OAuth secrets
        if: github.event_name != 'pull_request'
        working-directory: youtube-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_SESSION_SECRET: ${{ secrets.YOUTUBE_SESSION_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$YOUTUBE_SESSION_SECRET"
          test -n "$YOUTUBE_API_KEY"
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$YOUTUBE_SESSION_SECRET" | npx wrangler secret put YOUTUBE_SESSION_SECRET
          printf '%s' "$YOUTUBE_API_KEY" | npx wrangler secret put YOUTUBE_API_KEY

      - name: Smoke test YouTube Worker health
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          status=$(curl -sS -o health.json -w "%{http_code}" \
            https://youtube-auth.tifloacosta.com/health)
          cat health.json
          test "$status" = "200"
          grep -q '"service":"youtube-actions"' health.json
