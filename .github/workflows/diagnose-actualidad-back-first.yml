name: Diagnose Actualidad back first

on:
  push:
    branches:
      - fix/actualidad-back-first-focus

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
