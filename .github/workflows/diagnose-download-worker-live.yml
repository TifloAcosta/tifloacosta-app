name: Diagnose live download analyzer

on:
  push:
    branches:
      - 'feature/diagnose-download-worker-live'
    paths:
      - '.github/workflows/diagnose-download-worker-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare app and analyzer network paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== tifloacosta.com ==='
          dig +short @1.1.1.1 tifloacosta.com A
          dig +short @1.1.1.1 tifloacosta.com AAAA
          curl -4 -sS -o /dev/null -w 'main IPv4 HTTP %{http_code} remote=%{remote_ip}\n' --max-time 12 https://tifloacosta.com/
          curl -6 -sS -o /dev/null -w 'main IPv6 HTTP %{http_code} remote=%{remote_ip}\n' --max-time 12 https://tifloacosta.com/ || true

          echo '=== download.tifloacosta.com ==='
          dig +short @1.1.1.1 download.tifloacosta.com A
          dig +short @1.1.1.1 download.tifloacosta.com AAAA
          curl -4 -sS -o /dev/null -w 'download IPv4 HTTP %{http_code} remote=%{remote_ip}\n' --max-time 12 https://download.tifloacosta.com/analyze
          curl -6 -sS -o /dev/null -w 'download IPv6 HTTP %{http_code} remote=%{remote_ip}\n' --max-time 12 https://download.tifloacosta.com/analyze || true
