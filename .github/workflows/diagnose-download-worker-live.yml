name: Diagnose live download analyzer

on:
  push:
    branches:
      - 'feature/diagnose-download-worker-live'
    paths:
      - '.github/workflows/diagnose-download-worker-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Worker custom domain binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=download.tifloacosta.com" \
            -o domains.json

          python - <<'PY'
          import json
          data = json.load(open('domains.json', encoding='utf-8'))
          print('success:', data.get('success'))
          print('errors:', data.get('errors'))
          for item in data.get('result') or []:
              print('hostname:', item.get('hostname'))
              print('service:', item.get('service'))
              print('environment:', item.get('environment'))
              print('zone_name:', item.get('zone_name'))
              print('zone_id:', item.get('zone_id'))
              print('cert_id_present:', bool(item.get('cert_id')))
          PY

          zone_id=$(python - <<'PY'
          import json
          data = json.load(open('domains.json', encoding='utf-8'))
          result = data.get('result') or []
          print(result[0].get('zone_id','') if result else '')
          PY
          )

          if [ -n "$zone_id" ]; then
            echo '=== Worker routes for zone ==='
            curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes" \
              -o routes.json
            python - <<'PY'
          import json
          data = json.load(open('routes.json', encoding='utf-8'))
          print('routes_success:', data.get('success'))
          print('routes_errors:', data.get('errors'))
          for item in data.get('result') or []:
              print('route:', item.get('pattern'), '->', item.get('script'))
          PY
          fi
