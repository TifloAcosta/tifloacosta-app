name: Diagnose live download analyzer

on:
  push:
    branches:
      - 'feature/diagnose-download-worker-live'
    paths:
      - '.github/workflows/diagnose-download-worker-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS and IP family reachability
        shell: bash
        run: |
          set -euo pipefail

          echo '=== Public DNS A/AAAA ==='
          for resolver in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "--- resolver $resolver ---"
            dig +time=3 +tries=1 @"$resolver" download.tifloacosta.com A || true
            dig +time=3 +tries=1 @"$resolver" download.tifloacosta.com AAAA || true
          done

          echo '=== Nameservers ==='
          dig +time=3 +tries=1 @1.1.1.1 tifloacosta.com NS || true

          echo '=== DNSSEC / trace ==='
          dig +dnssec +time=3 +tries=1 @1.1.1.1 download.tifloacosta.com A || true
          dig +trace +time=3 +tries=1 download.tifloacosta.com A || true

          echo '=== HTTPS by IP family ==='
          curl -4 -sS -o ipv4-body.txt -D ipv4-headers.txt -w 'IPv4 HTTP %{http_code} remote=%{remote_ip} time=%{time_total}\n' --max-time 12 https://download.tifloacosta.com/analyze || true
          cat ipv4-headers.txt 2>/dev/null || true
          cat ipv4-body.txt 2>/dev/null || true

          curl -6 -sS -o ipv6-body.txt -D ipv6-headers.txt -w 'IPv6 HTTP %{http_code} remote=%{remote_ip} time=%{time_total}\n' --max-time 12 https://download.tifloacosta.com/analyze || true
          cat ipv6-headers.txt 2>/dev/null || true
          cat ipv6-body.txt 2>/dev/null || true
