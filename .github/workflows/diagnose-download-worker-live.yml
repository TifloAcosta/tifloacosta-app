name: Diagnose live download analyzer

on:
  push:
    branches:
      - 'feature/diagnose-download-worker-live'
    paths:
      - '.github/workflows/diagnose-download-worker-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify workers.dev fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -o account-subdomain.json

          curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tifloacosta-download-analyzer/subdomain" \
            -o script-subdomain.json

          python - <<'PY'
          import json
          account = json.load(open('account-subdomain.json', encoding='utf-8'))
          script = json.load(open('script-subdomain.json', encoding='utf-8'))
          assert account.get('success') is True
          assert script.get('success') is True
          assert (script.get('result') or {}).get('enabled') is True
          print('workers.dev enabled')
          PY

          fallback='https://tifloacosta-download-analyzer.tonytenerife.workers.dev/analyze'
          status=$(curl -sS -D headers.txt -o response.json -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://tifloacosta.com' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://ftp.gnu.org/gnu/wget/"}' \
            "$fallback")

          python - <<'PY'
          import json
          data = json.load(open('response.json', encoding='utf-8'))
          items = data.get('items') or []
          print('status:', data.get('status'))
          print('items:', len(items))
          assert data.get('status') == 'ok'
          assert len(items) > 0
          PY

          test "$status" = "200"
          grep -qi '^access-control-allow-origin: https://tifloacosta.com' headers.txt
