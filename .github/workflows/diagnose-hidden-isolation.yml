name: Diagnose hidden isolation

on:
  push:
    branches:
      - fix/hidden-isolation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/hidden-isolation.test.mjs
