name: Diagnose hidden isolation

on:
  push:
    branches:
      - fix/hidden-isolation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hidden-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hidden isolation rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          rule = '[hidden] { display:none !important; }\n'
          if rule not in text:
              marker = '* { box-sizing:border-box; }\n'
              text = text.replace(marker, marker + rule, 1) if marker in text else rule + text
              path.write_text(text, encoding='utf-8')
          PY
      - run: node --test test/hidden-isolation.test.mjs
      - name: Commit fix
        run: |
          git config user.name 'TifloAcosta'
          git config user.email '146574974+TifloAcosta@users.noreply.github.com'
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: respetar hidden en todas las vistas'
          git push origin HEAD:fix/hidden-isolation
