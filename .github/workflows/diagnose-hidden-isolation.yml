name: Diagnose hidden isolation

on:
  push:
    branches:
      - fix/hidden-isolation

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hidden-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hidden isolation and refresh styles
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          rule = '[hidden] { display:none !important; }\n'
          if rule not in text:
              marker = '* { box-sizing:border-box; }\n'
              text = text.replace(marker, marker + rule, 1) if marker in text else rule + text
              css.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              updated = html.replace('styles.css?v=1.1', 'styles.css?v=1.2')
              if updated != html:
                  path.write_text(updated, encoding='utf-8')

          worker = Path('sw.js')
          sw = worker.read_text(encoding='utf-8')
          sw = sw.replace("'./styles.css?v=1.1'", "'./styles.css?v=1.2'")
          sw = sw.replace("tifloacosta-app-v2-9-actualidad-back-first", "tifloacosta-app-v2-10-hidden-isolation")
          worker.write_text(sw, encoding='utf-8')
          PY
      - name: Commit source fix
        run: |
          git config user.name 'TifloAcosta'
          git config user.email '146574974+TifloAcosta@users.noreply.github.com'
          git add styles.css '*.html' sw.js
          git diff --cached --quiet || git commit -m 'fix: aislar correctamente las vistas ocultas'
          git push origin HEAD:fix/hidden-isolation
      - run: node --test test/*.test.mjs
