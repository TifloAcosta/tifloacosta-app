name: Diagnose live download analyzer

on:
  push:
    branches:
      - feature/iphone-download-stage-diagnostics
    paths:
      - '.github/workflows/diagnose-live-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full repository tests
        run: npm test

      - name: Probe GNU Wget directory through live Worker
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/wget-analysis.json"
          http_code=$(curl --silent --show-error --location \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 20 \
            -H 'Origin: https://tifloacosta.com' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://ftp.gnu.org/gnu/wget/"}' \
            https://download.tifloacosta.com/analyze)
          echo "HTTP $http_code"
          node - "$response_file" "$http_code" <<'NODE'
          const fs = require('fs');
          const [file, httpCode] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify({
            httpCode: Number(httpCode),
            status: payload.status,
            code: payload.code || null,
            provider: payload.provider || null,
            itemCount: Array.isArray(payload.items) ? payload.items.length : 0,
            firstItems: Array.isArray(payload.items) ? payload.items.slice(0, 5).map(item => ({ name:item.name, type:item.type, size:item.size })) : []
          }, null, 2));
          if (Number(httpCode) !== 200 || payload.status !== 'ok' || !Array.isArray(payload.items) || payload.items.length === 0) {
            process.exit(1);
          }
          NODE
