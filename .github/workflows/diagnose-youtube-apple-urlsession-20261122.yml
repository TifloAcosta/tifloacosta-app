name: Diagnosticar búsqueda YouTube con URLSession de Apple
on:
  push:
    branches:
      - development/next-public-1.6-500200-20261121
    paths:
      - .github/workflows/diagnose-youtube-apple-urlsession-20261122.yml
      - ios-app-native/scripts/probe-youtube-native-urlsession.swift
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-network:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probar Origin y decodificación con URLSession real
        run: |
          swiftc -parse-as-library \
            ios-app-native/scripts/probe-youtube-native-urlsession.swift \
            -o "$RUNNER_TEMP/youtube-native-probe"
          "$RUNNER_TEMP/youtube-native-probe"
