name: Finalizar biblioteca independiente de Drive

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-drive-free-library.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corregir rutas y retirar código antiguo de Drive
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import re

          root = Path('.')

          # Si un recurso conserva una URL genérica inexistente pero tiene una página
          # local válida en openUrl, usar esa misma página también como URL de descarga.
          data_path = root/'data.js'
          data = data_path.read_text(encoding='utf-8')

          def local_file(url):
              if not url:
                  return None
              p = urlparse(url)
              if p.hostname not in ('tifloacosta.com', 'www.tifloacosta.com'):
                  return None
              rel = unquote(p.path.lstrip('/'))
              return root/rel if rel.startswith('docs/') else None

          def fix_block(match):
              block = match.group(0)
              u = re.search(r'"url":\s*"([^"]+)"', block)
              o = re.search(r'"openUrl":\s*"([^"]+)"', block)
              if not u or not o:
                  return block
              url, open_url = u.group(1), o.group(1)
              url_file, open_file = local_file(url), local_file(open_url)
              if url_file and not url_file.exists() and open_file and open_file.exists():
                  block = block.replace(f'"url": "{url}"', f'"url": "{open_url}"', 1)
              return block

          data = re.sub(r'\{\n(?:[^{}]|\{[^{}]*\})*?\n  \}', fix_block, data)
          data_path.write_text(data, encoding='utf-8')

          # Los tonos están en /media/tones en la raíz del sitio.
          test_path = root/'test/no-google-drive-library.test.mjs'
          test = test_path.read_text(encoding='utf-8')
          if "from 'node:url'" not in test:
              test = test.replace("import vm from 'node:vm';", "import vm from 'node:vm';\nimport { fileURLToPath } from 'node:url';")
          test = test.replace(
              "const mediaDir = new URL('../docs/media/tones/', import.meta.url);",
              "const mediaDir = fileURLToPath(new URL('../media/tones/', import.meta.url));"
          )
          test = test.replace(
              "const mediaDir = new URL('../media/tones/', import.meta.url);",
              "const mediaDir = fileURLToPath(new URL('../media/tones/', import.meta.url));"
          )
          test_path.write_text(test, encoding='utf-8')

          app_path = root/'app.js'
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(
              r"\n  function extractDriveFileId\(url\) \{.*?\n  \}\n\n  function driveDownloadUrl\(url\) \{.*?\n  \}\n",
              "\n",
              app,
              flags=re.S
          )
          app = app.replace(
              "const downloadLink=makeLink(labels.download,driveDownloadUrl(item.url));",
              "const downloadLink=makeLink(labels.download,item.url);"
          )
          app = app.replace(
              "if(!extractDriveFileId(item.url)&&localDownloadUrl.origin===location.origin) downloadLink.setAttribute('download','');",
              "if(localDownloadUrl.origin===location.origin) downloadLink.setAttribute('download','');"
          )
          if 'driveDownloadUrl' in app or 'extractDriveFileId' in app or 'drive.google.com' in app:
              raise SystemExit('Queda código específico de Google Drive en app.js')
          app_path.write_text(app, encoding='utf-8')

      - name: Regenerar contenido móvil
        run: node scripts/build-mobile-content.mjs

      - name: Ejecutar validación completa
        run: node --test test/no-google-drive-library.test.mjs

      - name: Guardar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js app.js mobile-content.json test/no-google-drive-library.test.mjs
          git commit -m "Cerrar independencia de Google Drive en la biblioteca"
          git push
