name: Finalizar biblioteca independiente de Drive

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-drive-free-library.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corregir rutas y retirar código antiguo de Drive
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # El recurso ya tiene una página local completa: reutilizarla también para descarga.
          data = (root/'data.js').read_text(encoding='utf-8')
          data = data.replace(
              '"url": "https://tifloacosta.com/docs/es/reader-1FKsaxZ_-NgKsHWWBI_i25X8rEqwQHTgN.html",\n    "openUrl": "https://tifloacosta.com/docs/es/lo-que-no-puede-faltar-en-tu-iphone.html?reader=2"',
              '"url": "https://tifloacosta.com/docs/es/lo-que-no-puede-faltar-en-tu-iphone.html?reader=2",\n    "openUrl": "https://tifloacosta.com/docs/es/lo-que-no-puede-faltar-en-tu-iphone.html?reader=2"'
          )
          (root/'data.js').write_text(data, encoding='utf-8')

          # Los tonos están en /media/tones en la raíz del sitio, no dentro de /docs.
          test = (root/'test/no-google-drive-library.test.mjs').read_text(encoding='utf-8')
          test = test.replace("new URL('../docs/media/tones/', import.meta.url)", "new URL('../media/tones/', import.meta.url)")
          (root/'test/no-google-drive-library.test.mjs').write_text(test, encoding='utf-8')

          app_path = root/'app.js'
          app = app_path.read_text(encoding='utf-8')

          # Eliminar las dos funciones específicas de Google Drive.
          app = re.sub(
              r"\n  function extractDriveFileId\(url\) \{.*?\n  \}\n\n  function driveDownloadUrl\(url\) \{.*?\n  \}\n",
              "\n",
              app,
              flags=re.S
          )

          # La descarga usa ahora directamente el recurso local.
          app = app.replace(
              "const downloadLink=makeLink(labels.download,driveDownloadUrl(item.url));",
              "const downloadLink=makeLink(labels.download,item.url);"
          )
          app = app.replace(
              "if(!extractDriveFileId(item.url)&&localDownloadUrl.origin===location.origin) downloadLink.setAttribute('download','');",
              "if(localDownloadUrl.origin===location.origin) downloadLink.setAttribute('download','');"
          )

          if 'driveDownloadUrl' in app or 'extractDriveFileId' in app or 'drive.google.com' in app:
              raise SystemExit('Queda código específico de Google Drive en app.js')

          app_path.write_text(app, encoding='utf-8')

      - name: Regenerar contenido móvil
        run: node scripts/build-mobile-content.mjs

      - name: Ejecutar validación completa
        run: node --test test/no-google-drive-library.test.mjs

      - name: Guardar correcciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js app.js mobile-content.json test/no-google-drive-library.test.mjs
          git commit -m "Cerrar independencia de Google Drive en la biblioteca"
          git push
