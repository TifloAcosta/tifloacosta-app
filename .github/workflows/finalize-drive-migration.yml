name: Finalize Drive migration

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/finalize-drive-migration.mjs"
      - ".github/workflows/finalize-drive-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive downloader
        run: python -m pip install --disable-pip-version-check --upgrade gdown
      - name: Add resilient recovery for the final blocked ringtone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize-drive-migration.mjs')
          source = path.read_text(encoding='utf-8')
          needle = "  await mkdir(mediaDir, { recursive: true });\n\n  try {\n    execFileSync('gdown', ['--folder', TONES_FOLDER, '--continue', '--retries', '4', '-O', mediaDir], { stdio: 'inherit', cwd: ROOT });"
          replacement = """  await mkdir(mediaDir, { recursive: true });

  const dingTarget = path.join(mediaDir, 'Nokia', '22_Ding_dong.mp3');
  await mkdir(path.dirname(dingTarget), { recursive: true });
  try {
    downloadDriveFile('1DaQxtU59gjY7r7cmqHpvTEHUBRfSl9N7', dingTarget);
  } catch (error) {
    execFileSync('curl', [
      '-L', '--fail', '--retry', '4', '--retry-delay', '2',
      '-o', dingTarget,
      'https://drive.usercontent.google.com/download?id=1DaQxtU59gjY7r7cmqHpvTEHUBRfSl9N7&export=download&confirm=t'
    ], { stdio: 'inherit', cwd: ROOT });
  }

  try {
    execFileSync('gdown', ['--folder', TONES_FOLDER, '--continue', '--retries', '4', '-O', mediaDir], { stdio: 'inherit', cwd: ROOT });"""
          if needle not in source:
              raise SystemExit('Migration script patch point was not found')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Migrate resources and tones from Drive
        run: node scripts/finalize-drive-migration.mjs
      - name: Regenerate mobile content
        run: node scripts/build-mobile-content.mjs
      - name: Run complete test suite
        run: node --test
      - name: Remove one-shot migration files
        run: |
          rm scripts/finalize-drive-migration.mjs
          rm .github/workflows/finalize-drive-migration.yml
      - name: Commit migration
        run: |
          git config user.name "TifloAcosta automation"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add -A
          git commit -m "feat: host resource library entirely on TifloAcosta"
          git push origin main
