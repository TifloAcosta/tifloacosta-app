name: Generate mobile native projects

on:
  push:
    branches:
      - feature/mobile-foundation
    paths:
      - '.github/workflows/generate-mobile-platforms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-foundation

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run root tests
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate iOS project
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Commit generated native projects
        shell: bash
        run: |
          git config user.name "TifloAcosta Mobile Build"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android mobile/ios
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: generate Capacitor native projects"
          git push origin HEAD:feature/mobile-foundation
