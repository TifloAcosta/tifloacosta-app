name: Generate mobile native projects

on:
  push:
    branches:
      - feature/mobile-foundation
    paths:
      - '.github/workflows/generate-mobile-platforms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-foundation

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run root tests
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate iOS project
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Document mobile development commands
        shell: bash
        run: |
          if ! grep -q '^APLICACIONES OFICIALES EN DESARROLLO$' README.txt; then
            cat >> README.txt <<'EOF'

APLICACIONES OFICIALES EN DESARROLLO
TifloAcosta mantiene la PWA pública en https://tifloacosta.com/ mientras se desarrollan por separado las aplicaciones oficiales para iOS y Android.

La base móvil usa Capacitor 8 y requiere Node.js 22 o posterior.

Comandos de desarrollo:
cd mobile
npm install
npm test
npm run sync:android
npm run sync:ios   (macOS)

Los proyectos nativos viven en mobile/android y mobile/ios. Los cambios de la aplicación móvil deben probarse en la rama de desarrollo antes de integrarlos en main.
EOF
          fi

      - name: Commit generated native projects
        shell: bash
        run: |
          git config user.name "TifloAcosta Mobile Build"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android mobile/ios README.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: generate Capacitor native projects"
          git push origin HEAD:feature/mobile-foundation
