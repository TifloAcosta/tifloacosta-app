name: Diagnóstico de acceso OPDS Gutenberg
on:
  workflow_dispatch:
  push:
    branches:
      - development/next-public-1.6-500200-20261121
    paths:
      - '.github/workflows/gutenberg-opds-probe.yml'
      - 'ios-app-native/scripts/probe-gutenberg-opds.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Consultar una sola página del catálogo oficial
        run: python3 ios-app-native/scripts/probe-gutenberg-opds.py
