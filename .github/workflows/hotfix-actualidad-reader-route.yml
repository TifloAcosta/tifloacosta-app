name: Apply Actualidad reader route hotfix

on:
  push:
    branches:
      - feature/actualidad-blank-screen-fix
    paths:
      - '.github/workflows/hotfix-actualidad-reader-route.yml'
      - 'actualidad-core.js'

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[skip hotfix]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/actualidad-blank-screen-fix
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch stale reader route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('actualidad-core.js')
          text = path.read_text()
          old = """    if (page === 'actualidad') {
              const parents = {
                'news-browser': 'actualidad-home',
                'apps-browser': 'actualidad-home',
                'media-browser': 'actualidad-home',
                'media-accessibility': 'media-browser',
                'media-technology': 'media-browser',
                'news-reader': 'news-browser'
              };
              return parents[route]
                ? { view: route, parent: parents[route], chromeVisible: false }
                : { view: 'actualidad-home', parent: null, chromeVisible: false };
            }
          """
          new = """    if (page === 'actualidad') {
              if (route === 'news-reader') {
                return { view: 'news-browser', parent: 'actualidad-home', chromeVisible: false };
              }
              const parents = {
                'news-browser': 'actualidad-home',
                'apps-browser': 'actualidad-home',
                'media-browser': 'actualidad-home',
                'media-accessibility': 'media-browser',
                'media-technology': 'media-browser'
              };
              return parents[route]
                ? { view: route, parent: parents[route], chromeVisible: false }
                : { view: 'actualidad-home', parent: null, chromeVisible: false };
            }
          """
          if old not in text:
              raise SystemExit('Expected resolver block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify full test suite
        run: npm test
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad-core.js
          git commit -m "fix: prevent blank Actualidad reader route [skip hotfix]"
          git push origin HEAD:feature/actualidad-blank-screen-fix
