name: Inspect Google Play unprotected APK 1.3.9
on:
  push:
    branches:
      - fix/android-139-production-native-entry-20261030
    paths:
      - mobile/release/inspect-play-unprotected.once
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect Play signed unprotected candidates, no release operations
        working-directory: mobile
        run: node scripts/inspect-play-unprotected-139.mjs
