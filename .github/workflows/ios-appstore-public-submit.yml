name: TifloAcosta 1.3 - enviar version publica a revision Apple
on:
  push:
    branches:
      - audit/ios-public-release-six-languages-20261112
      - fix/ios-daisy-clipbegin-milliseconds-20261113
    paths:
      - '.github/workflows/ios-appstore-public-submit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tifloacosta-ios-appstore-version-1-3-submission
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      TARGET_BUILD: "500157"
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de la automatizacion y novedades oficiales
        run: |
          node --check ios-app-native/scripts/appstore-public-submit.mjs
          node --test ios-app-native/tests/final-language-coverage-20261112.test.mjs
      - name: Asociar compilacion validada y enviar actualizacion 1.3 a revision
        run: node ios-app-native/scripts/appstore-public-submit.mjs
