name: Verificar base iOS (sin publicar)
on:
  workflow_dispatch:
  push:
    branches: [preparacion-ios, work/ios-tiflolector-native-20261012, fix/ios-novedades-lector-regresion-20261013]
  pull_request:
    branches: [preparacion-ios]
    paths:
      - 'ios-build/**'
      - 'web-reading.js'
      - 'sw.js'
      - 'test/web-reading*.test.mjs'
      - 'shared/web-reading-pronunciation.mjs'
      - 'shared/web-entry.mjs'
      - 'index.html'
      - 'mobile/src/screens/reading-*.mjs'
      - '.github/workflows/ios-check.yml'
jobs:
  tiflolector-static-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis del lector que se empaqueta en iOS
        run: |
          node --check ios-build/prepare-web.mjs
          node --check web-reading.js
          node --check shared/web-reading-navigation.mjs
          node --check shared/web-reading-pronunciation.mjs
          node --check ios-build/ios-parity.js
          node --check tifloacosta-guide.js
      - name: Probar controles y contratos de TifloLector sin publicar
        run: node --test ios-build/test/tiflolector-structure.test.mjs
      - name: Ejecutar las pruebas existentes del lector web
        run: node --test test/web-reading*.test.mjs
  ios-unsigned-build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: ios-build
        run: npm install --no-audit --no-fund
      - name: Preparar contenido web
        working-directory: ios-build
        env:
          TIFLO_IOS_AUDIT_UNSIGNED: '1'
        run: npm run prepare:web
      - name: Generar y configurar plataforma iOS
        working-directory: ios-build
        run: |
          npx cap add ios
          node install-native-video.mjs
          ruby configure-ios-compliance.rb
          (cd ios/App && pod install)
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/App/App/Info.plist)" = false
      - name: Comprobar compilacion de simulador sin firma
        working-directory: ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Comprobar compilacion para iPhone sin firma ni distribucion
        working-directory: ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
