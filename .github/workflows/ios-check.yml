name: Verificar base iOS (sin publicar)
on:
  workflow_dispatch:
  push:
    branches: [preparacion-ios, work/ios-tiflolector-native-20261012]
    paths:
      - 'ios-build/**'
      - 'web-reading.js'
      - 'sw.js'
      - 'test/web-reading*.test.mjs'
      - 'index.html'
      - 'mobile/src/screens/reading-*.mjs'
      - '.github/workflows/ios-check.yml'
      - '.github/workflows/ios-testflight.yml'
jobs:
  tiflolector-static-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis del lector que se empaqueta en iOS
        run: |
          node --check ios-build/prepare-web.mjs
          node --check ios-build/patch-reading-native.mjs
          node --check ios-build/ios-reader-folders.js
          node --check ios-build/ios-reader-native.js
          node --check web-reading.js
          node --check shared/web-reading-navigation.mjs
          node --check ios-build/ios-parity.js
          node --check tifloacosta-guide.js
      - name: Probar controles, recepción compartida y contratos VoiceOver sin publicar
        run: |
          node --test ios-build/test/tiflolector-structure.test.mjs ios-build/test/tiflolector-regresiones-20261014.test.mjs ios-build/test/ios-share-routing.test.mjs test/ios-share.test.mjs
          node --check ios-build/ios-share-inbox.js
          node --check ios-build/ios-appwide-native-actions.js
          node --check ios-build/ios-accessible-actions.js
      - name: Ejecutar las pruebas existentes del lector web
        run: node --test test/web-reading*.test.mjs
  ios-unsigned-build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        working-directory: ios-build
        run: npm install --no-audit --no-fund
      - name: Preparar contenido web
        working-directory: ios-build
        run: npm run prepare:web
      - name: Verificar sintaxis Swift de extensión, puente de compartir y accesibilidad
        run: |
          swiftc -frontend -parse ios-build/share-extension/ShareViewController.swift
          swiftc -frontend -parse ios-build/native/TifloShareInboxPlugin.swift
          swiftc -frontend -parse ios-build/native/TifloReadingAccessibilityPlugin.swift
      - name: Generar y configurar plataforma iOS
        working-directory: ios-build
        run: |
          npx cap add ios
          node install-native-video.mjs
          ruby configure-ios-compliance.rb
          (cd ios/App && pod install)
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/App/App/Info.plist)" = false
      - name: Comprobar compilacion de simulador sin firma
        working-directory: ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Comprobar compilacion para iPhone sin firma ni distribucion
        working-directory: ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
