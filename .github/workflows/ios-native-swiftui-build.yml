name: iOS native SwiftUI compilation
on:
  push:
    branches:
      - main
      - 'ios/**'
    paths:
      - 'ios-app-native/**'
      - '.github/workflows/ios-native-swiftui-build.yml'
  pull_request:
    branches: [main, 'ios/swiftui-native-separation-20261018']
    paths:
      - 'ios-app-native/**'
      - '.github/workflows/ios-native-swiftui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check native-only source boundary
        run: |
          if grep -R -E 'WKWebView|CAPBridgeViewController|import Capacitor' ios-app-native/Sources; then
            echo 'Native screen source must not contain a Capacitor / WebView UI.'
            exit 1
          fi
      - name: Check native home and catalog search
        run: node ios-app-native/tests/home-contract.test.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate independent iOS project
        working-directory: ios-app-native
        run: xcodegen generate --spec project.yml
      - name: Validate extension metadata after project generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path("ios-app-native/ShareExtension/Info.plist")
          plist = plistlib.loads(path.read_bytes())
          point = plist.get("NSExtension", {}).get("NSExtensionPointIdentifier")
          if point != "com.apple.share-services":
              raise SystemExit("Share Extension Info.plist was regenerated or lost its extension identifier")
          print("Share Extension metadata preserved after XcodeGen")
          PY
      - name: Compile for iPhone simulator (no signing)
        working-directory: ios-app-native
        run: |
          xcodebuild -project TifloAcostaNative.xcodeproj \
            -scheme TifloAcostaNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TifloNativeDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Validate compiled .appex metadata used by TestFlight
        run: |
          PLIST="$RUNNER_TEMP/TifloNativeDerivedData/Build/Products/Debug-iphonesimulator/TifloAcostaNative.app/PlugIns/TifloAcostaShare.appex/Info.plist"
          test -f "$PLIST" || { echo "::error::Missing embedded Share Extension"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$PLIST")" = "com.apple.share-services" || {
            echo "::error::Missing NSExtensionPointIdentifier in built extension"; exit 1;
          }
          echo "Native .appex metadata verified"
