name: iOS native SwiftUI compilation
on:
  push:
    branches:
      - main
    paths:
      - 'ios-app-native/**'
      - '.github/workflows/ios-native-swiftui-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios-app-native/**'
      - '.github/workflows/ios-native-swiftui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check native-only source boundary
        run: |
          # Única excepción: YouTube exige su reproductor oficial dentro de WebKit.
          # No permitir pantallas web ni Capacitor en el resto de SwiftUI.
          if find ios-app-native/Sources -name '*.swift' ! -name 'NativeYouTubePlayer.swift' -print0 | xargs -0 grep -nE 'WKWebView|CAPBridgeViewController|import Capacitor'; then
            echo "::error::Se ha detectado una interfaz híbrida fuera del reproductor oficial"
            exit 1
          fi
          if grep -nE 'CAPBridgeViewController|import Capacitor' ios-app-native/Sources/NativeYouTubePlayer.swift; then
            echo "::error::El reproductor de YouTube contiene código híbrido"
            exit 1
          fi
      - name: Check native home and catalog search
        run: node --test ios-app-native/tests/*.test.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verificar icono oficial iOS sin bordes blancos
        run: |
          set -euo pipefail
          ASSETS="ios-app-native/Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ASSETS"
          swift ios-app-native/scripts/make-app-icon.swift tifloacosta-icon-512.png "$ASSETS/AppIcon.png"
          test -s "$ASSETS/AppIcon.png"
          printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ASSETS/Contents.json"
      - name: Generate independent iOS project
        working-directory: ios-app-native
        run: xcodegen generate --spec project.yml
      - name: Validate extension metadata after project generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          path = Path("ios-app-native/ShareExtension/Info.plist")
          plist = plistlib.loads(path.read_bytes())
          point = plist.get("NSExtension", {}).get("NSExtensionPointIdentifier")
          if point != "com.apple.share-services":
              raise SystemExit("Share Extension Info.plist was regenerated or lost its extension identifier")
          print("Share Extension metadata preserved after XcodeGen")
          PY
      - name: Compile for iPhone simulator (no signing)
        working-directory: ios-app-native
        run: |
          xcodebuild -project TifloAcostaNative.xcodeproj \
            -scheme TifloAcostaNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TifloNativeDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Validate compiled .appex metadata used by TestFlight
        run: |
          PLIST="$RUNNER_TEMP/TifloNativeDerivedData/Build/Products/Debug-iphonesimulator/TifloAcostaNative.app/PlugIns/TifloAcostaShare.appex/Info.plist"
          test -f "$PLIST" || { echo "::error::Missing embedded Share Extension"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$PLIST")" = "com.apple.share-services" || {
            echo "::error::Missing NSExtensionPointIdentifier in built extension"; exit 1;
          }
          echo "Native .appex metadata verified"

      - name: Capture simulator home for visual review (non-blocking)
        continue-on-error: true
        run: |
          SIM_ID="$(python3 - <<'PY'
          import json, subprocess
          result = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "-j", "devices", "available"], text=True
          ))
          phones = [d for values in result["devices"].values()
                    for d in values if "iPhone" in d.get("name", "") and d.get("isAvailable", True)]
          if not phones:
              raise SystemExit("No iPhone simulator available")
          print(phones[0]["udid"])
          PY
          )"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$RUNNER_TEMP/TifloNativeDerivedData/Build/Products/Debug-iphonesimulator/TifloAcostaNative.app"
          xcrun simctl launch "$SIM_ID" com.tifloacosta.app
          sleep 8
          mkdir -p "$RUNNER_TEMP/native-preview"
          xcrun simctl io "$SIM_ID" screenshot "$RUNNER_TEMP/native-preview/home.png"
          xcrun simctl shutdown "$SIM_ID"
      - name: Archive native home preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tifloacosta-ios-native-home-preview
          path: ${{ runner.temp }}/native-preview/home.png
          if-no-files-found: ignore
          retention-days: 14

