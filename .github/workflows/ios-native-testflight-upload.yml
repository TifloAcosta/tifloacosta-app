name: TifloAcosta iOS nativa - enviar a TestFlight
# Publicación a TestFlight únicamente cuando se solicite expresamente,
# después de integrar y revisar las fases de desarrollo.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operación expresa: diagnóstico de firma sin subida o envío autorizado"
        type: choice
        required: true
        default: none
        options:
          - none
          - sign-only
          - upload
      verify_build:
        description: "Compilación ya subida que se quiere verificar en TestFlight"
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: tifloacosta-ios-native-testflight
  cancel-in-progress: false
jobs:
  build-upload:
    if: ${{ inputs.verify_build == '' && (inputs.mode == 'sign-only' || inputs.mode == 'upload') }}
    runs-on: macos-15
    timeout-minutes: 80
    env:
      API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      API_PRIVATE: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      P12_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSPHRASE }}
      TIFLO_CINEMA_PUBLIC_DRIVE_API_KEY: ${{ secrets.TIFLO_CINEMA_PUBLIC_DRIVE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      TIFLO_IOS_MARKETING_VERSION: "1.7"
      TIFLO_SIGNING_PREFLIGHT: ${{ inputs.mode == 'sign-only' && '1' || '0' }}
      TIFLO_SIGNING_EXISTING_ONLY: '1'
      TIFLO_REUSE_APP_PROFILE: TifloAcosta-App-TestFlight-46032271719
      TIFLO_REUSE_SHARE_PROFILE: TifloAcosta-Share-TestFlight-46033031744
      TIFLO_ACOUSTID_CLIENT: ${{ vars.TIFLO_ACOUSTID_CLIENT }}
    steps:
      - name: Confirmar rama única de la beta interna
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/development/next-public-1.6-500200-20261121" ]; then
            echo "::error::La beta interna solo puede compilarse desde la rama única de la próxima actualización."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Impedir beta incompleta según registro de actualización
        if: ${{ inputs.mode == 'upload' }}
        run: node ios-app-native/scripts/check-release-readiness.mjs --internal-beta
      - name: Verificar evidencias de auditoría de idiomas
        if: ${{ inputs.mode == 'upload' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUDIT=ios-app-native/release-readiness-1.7.json
          SHA="$(jq -er '.internalBeta.linguisticAudit.validatedCommit' "$AUDIT")"
          for entry in "integrationRun:ios-next-beta-validation.yml" "navigationRun:ios-localization-ui-audit.yml"; do
            KEY="${entry%%:*}"
            FILE="${entry#*:}"
            ID="$(jq -er --arg key "$KEY" '.internalBeta.linguisticAudit[$key]' "$AUDIT")"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID" | jq -e --arg sha "$SHA" --arg path ".github/workflows/$FILE" --arg branch "$GITHUB_REF_NAME" '.conclusion == "success" and .status == "completed" and .head_sha == $sha and .path == $path and .head_branch == $branch' >/dev/null
          done
      - name: Identificar diagnóstico de firma sin distribución
        if: ${{ inputs.mode == 'sign-only' }}
        run: |
          echo 'Diagnóstico de firma: no es una beta aprobada, no sube a Apple ni modifica el inventario.'
          echo 'Se requiere certificado existente; solo se crearán perfiles para los dos IDs ya configurados.'
      - name: Validar Actualidad, Recursos y diseño sin HTML
        run: |
          set -euo pipefail
          node --test ios-app-native/tests/*.test.mjs
          # Única excepción: YouTube exige su reproductor oficial dentro de WebKit.
          # No permitir pantallas web ni Capacitor en el resto de SwiftUI.
          if find ios-app-native/Sources -name '*.swift' ! -name 'NativeYouTubePlayer.swift' -print0 | xargs -0 grep -nE 'WKWebView|CAPBridgeViewController|import Capacitor'; then
            echo "::error::Se ha detectado una interfaz híbrida fuera del reproductor oficial"
            exit 1
          fi
          if grep -nE 'CAPBridgeViewController|import Capacitor' ios-app-native/Sources/NativeYouTubePlayer.swift; then
            echo "::error::El reproductor de YouTube contiene código híbrido"
            exit 1
          fi
      - name: Seleccionar Xcode 26 y preparar herramientas
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$XCODE" || { echo "::error::Xcode 26 no disponible"; exit 1; }
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version
          brew install xcodegen openssl@3
      - name: Comprobar identificador AcoustID sin mostrar su valor
        run: |
          set -euo pipefail
          test -n "$TIFLO_ACOUSTID_CLIENT" || { echo "::error::Falta el identificador público AcoustID"; exit 1; }
      - name: Preparar API protegida de App Store Connect
        run: node ios-app-native/scripts/prepare-apple-key.mjs
      - name: Recuperar certificado Apple Distribution existente
        run: node ios-app-native/scripts/ensure-signing.mjs
      - name: Confirmar reutilización de certificado sin emitir otro
        run: test "$NEW_P12" = 'false'
      - name: Conservar P12 protegido si se generó un certificado
        if: ${{ inputs.mode == 'upload' && env.NEW_P12 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TifloAcosta-P12-protegido
          path: ${{ runner.temp }}/ios-signing/TifloAcosta.p12
          retention-days: 90
      - name: Comprobar que no existe otra compilación 1.7 en Apple
        if: ${{ inputs.mode == 'upload' }}
        run: node .github/scripts/verify-native-testflight.mjs --preflight
      - name: Importar certificado sin exponer claves
        run: bash ios-app-native/scripts/import-distribution-key.sh
      - name: Crear perfiles de app y extensión para TestFlight
        run: node ios-app-native/scripts/create-appstore-profiles.mjs
      - name: Preparar versión, identificadores y logo corporativo
        run: |
          set -euo pipefail
          node ios-app-native/scripts/prepare-testflight-project.mjs
          python3 ios-app-native/scripts/configure-cinema-drive-key.py --require
          swift ios-app-native/scripts/make-app-icon.swift tifloacosta-icon-512.png ios-app-native/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s ios-app-native/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          (cd ios-app-native && xcodegen generate --spec project.yml)
      - name: Archivar app SwiftUI firmada para distribución Apple
        run: |
          set -euo pipefail
          PROVISION_ARGS=()
          if [ "$TIFLO_SIGNING_PREFLIGHT" != "1" ]; then
            test "$TIFLO_SIGNING_EXISTING_ONLY" = "1" || { echo "::error::Se exige reutilizar los perfiles existentes"; exit 1; }
          fi
          xcodebuild -project ios-app-native/TifloAcostaNative.xcodeproj \
            -scheme TifloAcostaNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TifloAcosta.xcarchive" \
            ${PROVISION_ARGS[@]+"${PROVISION_ARGS[@]}"} \
            TIFLO_ACOUSTID_CLIENT="$TIFLO_ACOUSTID_CLIENT" \
            MARKETING_VERSION="$TIFLO_IOS_MARKETING_VERSION" CURRENT_PROJECT_VERSION="$IOS_BUILD_VERSION" archive
      - name: Configurar exportación con los dos perfiles de firma
        run: |
          python3 - <<'PY'
          import os,plistlib
          options={'method':'app-store-connect','destination':'export',
                   'signingStyle':'manual','signingCertificate':'Apple Distribution',
                   'teamID':'3A8G8A62YZ','provisioningProfiles':{
                       'com.tifloacosta.app':os.environ['IOS_PROFILE_APP_NAME'],
                       'com.tifloacosta.app.ShareExtension':os.environ['IOS_PROFILE_EXTENSION_NAME']
                   }}
          with open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb') as output:
              plistlib.dump(options,output)
          PY
      - name: Exportar IPA para App Store Connect
        run: |
          set -euo pipefail
          PROVISION_ARGS=()
          if [ "$TIFLO_SIGNING_PREFLIGHT" != "1" ]; then
            test "$TIFLO_SIGNING_EXISTING_ONLY" = "1" || { echo "::error::Se exige reutilizar los perfiles existentes"; exit 1; }
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TifloAcosta.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/native-export" \
            ${PROVISION_ARGS[@]+"${PROVISION_ARGS[@]}"}
      - name: Validar IPA y extensión antes de enviar
        run: python3 ios-app-native/scripts/verify-testflight-ipa.py
      - name: Confirmar diagnóstico local sin conservar el binario
        if: ${{ inputs.mode == 'sign-only' }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/native-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA"
          shasum -a 256 "$IPA"
          echo 'IPA diagnóstica verificada; no se ha enviado ni se publicará como artefacto.'
      - name: Subir compilación nativa a Apple TestFlight
        if: ${{ inputs.mode == 'upload' }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/native-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA"
          LOG="$RUNNER_TEMP/tifloacosta-upload.log"
          echo "UPLOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_ID" --apiIssuer "$API_ISSUER" >"$LOG" 2>&1 || {
            cat "$LOG"
            exit 1
          }
          cat "$LOG"
          if grep -Eiq 'UPLOAD FAILED|Failed to upload package|Validation failed|ERROR:.*altool|Invalid Pre-Release Train' "$LOG"; then
            echo '::error::Apple ha rechazado la subida. No se declarará como enviada.'
            exit 1
          fi
          if ! grep -Eiq 'No errors uploading|successfully uploaded|Upload succeeded|uploaded successfully|UPLOAD SUCCEEDED' "$LOG"; then
            echo "::error::No hay confirmación inequívoca de subida en altool."
            exit 1
          fi
          echo "Apple ha aceptado la subida; se comprobará el estado de TestFlight."
      - name: Confirmar beta disponible para probadores internos con Apple
        if: ${{ inputs.mode == 'upload' }}
        timeout-minutes: 18
        env:
          TARGET_BUILD: ${{ env.IOS_BUILD_VERSION }}
        run: node .github/scripts/verify-native-testflight.mjs
      - name: Limpiar claves y llavero temporal
        if: always()
        run: |
          if [ -n "$ASC_KEY_PATH" ]; then rm -f "$ASC_KEY_PATH"; fi
          if [ -n "$IOS_TEMP_KEYCHAIN" ]; then security delete-keychain "$IOS_TEMP_KEYCHAIN" || true; fi
          if [ "$TIFLO_SIGNING_PREFLIGHT" = "1" ]; then
            rm -rf "$RUNNER_TEMP/native-export" "$RUNNER_TEMP/TifloAcosta.xcarchive" "$RUNNER_TEMP/ios-signing"
          fi
  verify-uploaded-build:
    if: ${{ inputs.mode == 'none' && inputs.verify_build != '' && github.ref == 'refs/heads/development/next-public-1.6-500200-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      API_PRIVATE: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      TARGET_BUILD: ${{ inputs.verify_build }}
      UPLOAD_STARTED_AT: "1970-01-01T00:00:00Z"
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar beta ya subida para probadores internos
        run: |
          [[ "$TARGET_BUILD" =~ ^[0-9]+$ ]]
          node .github/scripts/verify-native-testflight.mjs
