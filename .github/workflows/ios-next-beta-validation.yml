name: Validar integración nativa de iOS 1.7 sin publicar
on:
  push:
    branches:
      - development/next-public-1.6-500200-20261121
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-17-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar todas las pruebas de contrato de iOS
        run: node --test ios-app-native/tests/*.test.mjs
      - name: Comprobar estado del inventario, sin bloquear la compilación de diagnóstico
        run: |
          node ios-app-native/scripts/check-release-readiness.mjs ||             echo "Integración aún incompleta: no activar TestFlight hasta superar el control obligatorio."
  build-without-distribution:
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode 26
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$XCODE" || { echo "::error::Falta Xcode 26"; exit 1; }
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Comprobar el orden DAISY con Swift real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeDaisyNCX.swift \
            ios-app-native/Sources/NativeDaisyAudioOrder.swift \
            ios-app-native/tests/daisy-audio-order-smoke.swift \
            -o "$RUNNER_TEMP/daisy-audio-order-check"
          "$RUNNER_TEMP/daisy-audio-order-check"
      - name: Validar DAISY 2.02 de audio con Swift y XML real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeDaisy202AudioLayout.swift \
            ios-app-native/tests/daisy-202-layout-smoke.swift \
            -o "$RUNNER_TEMP/daisy-202-layout-check"
          "$RUNNER_TEMP/daisy-202-layout-check"
      - name: Probar validación MPEG y metadatos ID3 grandes con Swift real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeMP3HeaderProbe.swift \
            ios-app-native/tests/mp3-header-probe-smoke.swift \
            -o "$RUNNER_TEMP/mp3-header-probe-check"
          "$RUNNER_TEMP/mp3-header-probe-check"
      - name: Verificar progreso exacto de lectura con Swift real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeReaderProgress.swift \
            ios-app-native/tests/reader-progress-smoke.swift \
            -o "$RUNNER_TEMP/reader-progress-check"
          "$RUNNER_TEMP/reader-progress-check"
      - name: Probar volumen independiente de Gemini y Phonon con Swift real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeReaderGeneratedVoiceVolume.swift \
            ios-app-native/tests/reader-generated-voice-volume-smoke.swift \
            -o "$RUNNER_TEMP/reader-generated-volume-check"
          "$RUNNER_TEMP/reader-generated-volume-check"
      - name: Comprobar continuidad de la cola TTS bloqueada con Swift real
        run: |
          set -euo pipefail
          swiftc ios-app-native/Sources/NativeReaderSpeechQueueWindow.swift \
            ios-app-native/tests/reader-speech-queue-background-smoke.swift \
            -o "$RUNNER_TEMP/reader-tts-background-queue"
          "$RUNNER_TEMP/reader-tts-background-queue"
      - name: Abrir y verificar los once formatos de conversión local
        env:
          CONVERSION_SAMPLES_DIR: ${{ runner.temp }}/conversion-samples
        run: bash ios-app-native/scripts/test-document-conversion.sh
      - name: Preparar credencial de catálogo público Google Drive si está configurada
        env:
          TIFLO_CINEMA_PUBLIC_DRIVE_API_KEY: ${{ secrets.TIFLO_CINEMA_PUBLIC_DRIVE_API_KEY }}
        run: python3 ios-app-native/scripts/configure-cinema-drive-key.py
      - name: Crear el proyecto nativo con XcodeGen
        run: |
          brew install xcodegen
          (cd ios-app-native && xcodegen generate --spec project.yml)
      - name: Compilar para simulador sin firma, TestFlight ni publicación
        run: |
          xcodebuild -project ios-app-native/TifloAcostaNative.xcodeproj \
            -scheme TifloAcostaNative -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TifloAcosta-17-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Auditar la muestra PDF con veraPDF (PDF/UA-1)
        run: bash ios-app-native/scripts/audit-conversion-pdf-ua.sh "$RUNNER_TEMP/conversion-samples/"conversion*.pdf
  pdf-engine-link-probe:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            triplet: arm64-ios
          - sdk: iphonesimulator
            triplet: arm64-ios-simulator
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y enlazar Cairo y qpdf para iOS
        env:
          IOS_SDK: ${{ matrix.sdk }}
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$xcode"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          root="$RUNNER_TEMP/pdf-vcpkg"
          git init -q "$root"
          git -C "$root" fetch --depth=1 https://github.com/microsoft/vcpkg.git 7281d8d64321f945f296e696d8561f68c8186c67
          git -C "$root" checkout --detach FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/tiflo-triplets"
          cat > "$RUNNER_TEMP/tiflo-triplets/$VCPKG_TARGET_TRIPLET.cmake" <<TRIPLET
          set(VCPKG_TARGET_ARCHITECTURE arm64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CMAKE_SYSTEM_NAME iOS)
          set(VCPKG_OSX_SYSROOT $IOS_SDK)
          set(VCPKG_OSX_DEPLOYMENT_TARGET 17.0)
          TRIPLET
          cd "$root"
          ./vcpkg install --overlay-triplets="$RUNNER_TEMP/tiflo-triplets" --triplet="$VCPKG_TARGET_TRIPLET" 'cairo[core]' 'qpdf[core]'
          prefix="$root/installed/$VCPKG_TARGET_TRIPLET"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$prefix/share/pkgconfig"
          cmake -S "$GITHUB_WORKSPACE/ios-app-native/tests/pdf-engine-ios" -B "$RUNNER_TEMP/pdf-probe" -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_TOOLCHAIN_FILE="$root/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" -DVCPKG_OVERLAY_TRIPLETS="$RUNNER_TEMP/tiflo-triplets"
          cmake --build "$RUNNER_TEMP/pdf-probe"
          probe="$RUNNER_TEMP/pdf-probe/pdf-engine-probe"
          xcrun vtool -show-build "$probe"
          xcrun otool -L "$probe"
          wc -c "$probe"
          find "$prefix/share" -name copyright -print
