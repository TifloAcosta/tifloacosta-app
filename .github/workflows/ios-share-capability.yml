name: Activar capacidad App Groups para Compartir (sin publicar)
on:
  pull_request:
    branches: [preparacion-ios]
    paths:
      - 'ios-build/enable-share-capability.mjs'
      - '.github/workflows/ios-share-capability.yml'
permissions:
  contents: read
jobs:
  enable-share-capability:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ios-compartir-nativo-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Habilitar capacidad APP_GROUPS en ambos identificadores
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --check ios-build/enable-share-capability.mjs
          node ios-build/enable-share-capability.mjs
