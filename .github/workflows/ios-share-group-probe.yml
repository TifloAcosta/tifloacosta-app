name: Verificar permiso real de App Group (sin publicar)
on:
  pull_request:
    branches: [preparacion-ios]
    paths:
      - 'ios-build/probe-share-group.mjs'
      - '.github/workflows/ios-share-group-probe.yml'
permissions:
  contents: read
jobs:
  inspect-apple-share-group:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ios-compartir-nativo-20261016'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar dos perfiles temporales, sin publicar
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --check ios-build/probe-share-group.mjs
          node ios-build/probe-share-group.mjs
