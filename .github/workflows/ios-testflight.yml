name: Preparar y enviar TifloAcosta iOS a TestFlight
# La auditoría de TifloLector impide publicar por cada push.
# Solo lanzar manualmente cuando los criterios de aceptación estén verificados.
on:
  workflow_dispatch:
  # A one-off release-request file explicitly authorizes a single build from
  # preparacion-ios. Ordinary source pushes NEVER trigger a TestFlight upload.
  push:
    branches: [preparacion-ios]
    paths:
      - 'ios-build/solicitud-testflight-20261014.txt'

permissions:
  contents: read
  actions: read

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 95
    steps:
      - name: Seleccionar Xcode 26 y SDK iOS 26 requerido por Apple
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$XCODE" || { echo "::error::El corredor macOS no tiene Xcode 26 instalado"; exit 1; }
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$SDK_VERSION" in 26.*|27.*|28.*) echo "SDK válido: $SDK_VERSION";; *) echo "::error::SDK iOS antiguo: $SDK_VERSION"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar origen único de interfaz antes de distribuir
        run: node ios-build/check-single-ui-release.mjs
      - name: Comprobar credenciales sin revelarlas
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          test -n "$API_ID" || { echo "Falta APPSTORE_API_KEY_ID"; exit 1; }
          test -n "$API_ISSUER" || { echo "Falta APPSTORE_API_ISSUER_ID"; exit 1; }
          test -n "$API_PRIVATE" || { echo "Falta APPSTORE_API_PRIVATE_KEY"; exit 1; }
      - name: Preparar clave de firma y subida
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_PRIVATE: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          export TARGET_KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${API_ID}.p8"
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          raw = os.environ['API_PRIVATE'].strip().strip('"').strip("'")
          if '\\n' in raw:
              raw = raw.replace('\\r\\n', '\n').replace('\\n', '\n')
          if '-----BEGIN' not in raw:
              try:
                  decoded = base64.b64decode(raw, validate=True).decode('utf-8')
                  if '-----BEGIN' in decoded:
                      raw = decoded
              except (ValueError, UnicodeDecodeError):
                  pass
          if '-----BEGIN PRIVATE KEY-----' not in raw or '-----END PRIVATE KEY-----' not in raw:
              raise SystemExit('La clave almacenada no tiene formato PEM PKCS8 reconocible. No se muestra su contenido.')
          Path(os.environ['TARGET_KEY']).write_text(raw.strip() + '\n')
          PY
          echo "ASC_KEY_PATH=$TARGET_KEY" >> "$GITHUB_ENV"
      - name: Preparar proyecto iOS
        working-directory: ios-build
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          node --check www/app.js
          node --check www/videos.js
          node --check www/actualidad-media.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const identity = JSON.parse(fs.readFileSync('www/tiflo-build-identity.json', 'utf8'));
          assert.equal(identity.sourceSha, process.env.GITHUB_SHA);
          assert.equal(identity.buildCode, String(400000 + Number(process.env.GITHUB_RUN_NUMBER)));
          assert.equal(identity.reader, 'web-reading.js');
          const reader = fs.readFileSync('www/web-reading.js', 'utf8');
          for (const marker of ['useDaisyAudioFile(', 'persistDaisyPosition(', 'ensureNativeLibraryActions(']) {
            assert.ok(reader.includes(marker), 'Missing TifloLector recovery '+marker);
          }
          console.log('TifloLector iOS source confirmed: '+identity.sourceSha.slice(0,12)+
            '; build '+identity.buildCode);
          NODE
          npx cap add ios
          test -s ios/App/App/public/tiflo-build-identity.js
          test -s ios/App/App/public/shared/web-reading-daisy-adapter.mjs
          node install-native-video.mjs
          ruby install-share-extension.rb
          grep -q 'registerPluginInstance(TifloYouTubePlugin())' ios/App/App/AppDelegate.swift
          ruby configure-ios-compliance.rb
          (cd ios/App && pod install)
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' ios/App/App/Info.plist)" = false
      - name: Verificar que la API YouTube para iOS está desplegada
        shell: bash
        run: |
          set -euo pipefail
          # Solo se exige este protocolo a compilaciones con la nueva cuenta nativa.
          if [ ! -f ios-build/native/TifloYouTubeAuth.swift ]; then
            echo "Esta compilación no incorpora la autenticación nativa de YouTube."
            exit 0
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          if ! code="$(curl -sS --retry 2 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            -o "$response" -w '%{http_code}' \
            https://youtube-auth.tifloacosta.com/native/capabilities)"; then
            echo "::error::El servicio YouTube no es accesible. No enviar esta compilación a TestFlight."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::El servicio YouTube devuelve HTTP $code. No enviar esta compilación a TestFlight."
            exit 1
          fi
          YOUTUBE_CAPABILITIES_FILE="$response" node <<'NODE'
          const fs = require('node:fs');
          let payload;
          try {
            payload = JSON.parse(fs.readFileSync(process.env.YOUTUBE_CAPABILITIES_FILE, 'utf8'));
          } catch {
            console.error('::error::El servicio YouTube devolvió una respuesta inválida.');
            process.exit(1);
          }
          const actions = payload.youtubeActions;
          if (payload.protocol !== 1 || payload.nativeAuth !== true ||
              !Array.isArray(actions) ||
              !['like', 'subscribe', 'comment'].every(action => actions.includes(action))) {
            console.error('::error::El Worker no admite aún las acciones de YouTube de iOS. No enviar a TestFlight.');
            process.exit(1);
          }
          console.log('Compatibilidad YouTube iOS verificada antes de la firma y subida.');
          NODE
      - name: Asignar número de compilación único para TestFlight
        working-directory: ios-build
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          # Builds anteriores (p. ej. 200062) no pueden reemplazarse con 69.
          # Mantener una serie creciente separada del contador de GitHub Actions.
          build_number = (400000 + Integer(ENV.fetch('BUILD_RUN_NUMBER'))).to_s
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'No se encontró el target App' unless app
          project.targets.select { |target| ['App', 'TifloShareExtension'].include?(target.name) }.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CURRENT_PROJECT_VERSION'] = build_number
            end
          end
          project.save
          puts "Número de compilación TestFlight: #{build_number}"
          RUBY
      - name: Configurar firma de distribución de app y extensión
        working-directory: ios-build
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'No se encontró el target App' unless app
          [app, project.targets.find { |target| target.name == 'TifloShareExtension' }].each do |target|
            abort 'No existe Share Extension' unless target
            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              config.build_settings['DEVELOPMENT_TEAM'] = '3A8G8A62YZ'
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            end
          end
          project.save
          pods = Xcodeproj::Project.open('ios/App/Pods/Pods.xcodeproj')
          pods.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            end
          end
          pods.save
          RUBY
      - name: Verificar que la aplicación compila sin firma
        working-directory: ios-build
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Recuperar o regenerar firma de distribución protegida
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSPHRASE }}
        run: node ios-build/ensure-signing.mjs
      - name: Conservar P12 cifrado para próximas compilaciones
        if: env.NEW_P12 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TifloAcosta-P12-protegido
          path: ${{ runner.temp }}/ios-signing/TifloAcosta.p12
          if-no-files-found: error
          retention-days: 90
      - name: Importar certificado de distribución en llavero temporal
        shell: bash
        env:
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$P12_PASSWORD" || { echo "::error::Falta IOS_SIGNING_KEY_PASSPHRASE"; exit 1; }
          test -s "$RUNNER_TEMP/ios-signing/TifloAcosta.p12" || { echo "::error::No se descargó el P12"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/tifloacosta-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Convertir el P12 heredado al formato moderno compatible con macOS.
          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"
          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          trap 'rm -f "$SIGNING_DIR/tifloacosta-temp.pem" "$SIGNING_DIR/TifloAcosta-moderno.p12"' EXIT
          "$OPENSSL3" pkcs12 -legacy -in "$SIGNING_DIR/TifloAcosta.p12" -passin env:P12_PASSWORD -nodes -out "$SIGNING_DIR/tifloacosta-temp.pem"
          # Usar el OpenSSL incluido en macOS para generar un PKCS12 compatible con Security.framework.
          /usr/bin/openssl pkcs12 -export -in "$SIGNING_DIR/tifloacosta-temp.pem" -out "$SIGNING_DIR/TifloAcosta-moderno.p12" -passout env:P12_PASSWORD -name "TifloAcosta Apple Distribution"
          # Comprobar que la contraseña permite leer el nuevo archivo antes de importarlo.
          /usr/bin/openssl pkcs12 -in "$SIGNING_DIR/TifloAcosta-moderno.p12" -info -noout -passin env:P12_PASSWORD
          rm -f "$SIGNING_DIR/tifloacosta-temp.pem"
          security import "$SIGNING_DIR/TifloAcosta-moderno.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "IOS_TEMP_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/ios-signing/TifloAcosta.p12"
      - name: Crear e instalar perfil App Store con la API de Apple
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          SIGNING_SHA="$(security find-identity -v -p codesigning "$IOS_TEMP_KEYCHAIN" | awk 'NR==1 {print $2}')"
          test -n "$SIGNING_SHA" || { echo "::error::No hay identidad válida de firma"; exit 1; }
          export SIGNING_SHA
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const enc = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const header = enc({alg:'ES256',kid:process.env.API_ID,typ:'JWT'});
          const payload = enc({iss:process.env.API_ISSUER,iat:now,exp:now+1100,aud:'appstoreconnect-v1'});
          const input = header+'.'+payload;
          const signature = crypto.sign('sha256', Buffer.from(input), {
            key:fs.readFileSync(process.env.ASC_KEY_PATH),dsaEncoding:'ieee-p1363'
          }).toString('base64url');
          const token = input+'.'+signature;
          const api = async (endpoint,options={}) => {
            const method=String(options.method||'GET').toUpperCase();
            const retryable=new Set([429,500,502,503,504]);
            const attempts=method==='GET'?5:1;
            for(let attempt=1;attempt<=attempts;attempt++){
              const response=await fetch('https://api.appstoreconnect.apple.com/v1/'+endpoint,{
                ...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers}
              });
              const body=await response.json();
              if(response.ok) return body;
              if(method==='GET' && retryable.has(response.status) && attempt<attempts){
                console.log('Consulta Apple API temporalmente fallida (HTTP '+response.status+'); reintento '+attempt+'/'+attempts);
                await new Promise(resolve=>setTimeout(resolve,2000*attempt));
                continue;
              }
              throw Error('API de Apple '+response.status+': '+JSON.stringify(body.errors||body).slice(0,700));
            }
          };
          const certs=await api('certificates?limit=200');
          const sha=process.env.SIGNING_SHA.replaceAll(':','').toUpperCase();
          const cert=certs.data.find(x=>{
            const content=x.attributes.certificateContent;
            if(!content) return false;
            return new crypto.X509Certificate(Buffer.from(content,'base64')).fingerprint.replaceAll(':','').toUpperCase()===sha;
          });
          if(!cert) throw Error('El certificado P12 importado no coincide con ningún certificado vigente de Apple Developer.');
          // Evitar la consulta filtrada que Apple devolvió como HTTP 500.
          // Hay dos identificadores registrados: obtenerlos en una sola lectura.
          const bundles=await api('bundleIds?limit=200');
          const bundle=bundles.data.find(x=>x.attributes.identifier==='com.tifloacosta.app');
          if(!bundle) throw Error('No existe el identificador com.tifloacosta.app en Apple Developer');
          let extBundle=bundles.data.find(x=>x.attributes.identifier==='com.tifloacosta.app.ShareExtension');
          if(!extBundle) {
            const created=await api('bundleIds',{method:'POST',body:JSON.stringify({data:{
              type:'bundleIds',attributes:{name:'TifloAcosta Compartir',platform:'IOS',identifier:'com.tifloacosta.app.ShareExtension'}
            }})});
            extBundle=created.data;
          }
          // The next step verifies the actual signed App Group entitlements
          // in both provisioning profiles, which is stronger than a capability
          // flag reported by the Bundle ID API.

          const profileName='TifloAcosta AppStore '+process.env.GITHUB_RUN_ID;
          const created=await api('profiles',{method:'POST',body:JSON.stringify({data:{
            type:'profiles',attributes:{name:profileName,profileType:'IOS_APP_STORE'},
            relationships:{
              bundleId:{data:{type:'bundleIds',id:bundle.id}},
              certificates:{data:[{type:'certificates',id:cert.id}]}
            }
          }})});
          const profile=created.data;
          const dir=path.join(process.env.HOME,'Library/MobileDevice/Provisioning Profiles');
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(path.join(dir,profile.attributes.uuid+'.mobileprovision'),Buffer.from(profile.attributes.profileContent,'base64'),{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,'IOS_PROFILE_NAME='+profileName+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,'IOS_APP_PROFILE_UUID='+profile.attributes.uuid+'\n');
          const extProfileName='TifloAcosta Share AppStore '+process.env.GITHUB_RUN_ID;
          const extCreated=await api('profiles',{method:'POST',body:JSON.stringify({data:{
            type:'profiles',attributes:{name:extProfileName,profileType:'IOS_APP_STORE'},
            relationships:{
              bundleId:{data:{type:'bundleIds',id:extBundle.id}},
              certificates:{data:[{type:'certificates',id:cert.id}]}
            }
          }})});
          const extProfile=extCreated.data;
          fs.writeFileSync(path.join(dir,extProfile.attributes.uuid+'.mobileprovision'),
            Buffer.from(extProfile.attributes.profileContent,'base64'),{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_ENV,'IOS_SHARE_PROFILE_NAME='+extProfileName+'\n');
          fs.appendFileSync(process.env.GITHUB_ENV,'IOS_SHARE_PROFILE_UUID='+extProfile.attributes.uuid+'\n');
          console.log('Perfil de distribución App Store generado e instalado.');
          NODE
      - name: Validar App Group en los dos perfiles Apple
        run: |
          python3 - <<'PY'
          import os, subprocess, plistlib
          from pathlib import Path
          folder = Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          for key in ('IOS_APP_PROFILE_UUID', 'IOS_SHARE_PROFILE_UUID'):
              profile = folder / (os.environ[key] + '.mobileprovision')
              if not profile.is_file():
                  raise SystemExit('Falta perfil: ' + key)
              decoded = subprocess.check_output(['security', 'cms', '-D', '-i', str(profile)])
              metadata = plistlib.loads(decoded)
              groups = metadata.get('Entitlements', {}).get('com.apple.security.application-groups', [])
              if 'group.com.tifloacosta.app' not in groups:
                  raise SystemExit('Apple no asoció el App Group a ' + key +
                                   '. Revisar Apple Developer antes de TestFlight.')
          print('Los perfiles de app y extensión incluyen el App Group.')
          PY
      - name: Asignar perfiles de firma de app y extensión
        working-directory: ios-build
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'No existe target App' unless app
          [app, project.targets.find { |target| target.name == 'TifloShareExtension' }].each do |target|
            abort 'No existe Share Extension' unless target
            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = '3A8G8A62YZ'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] =
                ENV.fetch(target.name == 'App' ? 'IOS_PROFILE_NAME' : 'IOS_SHARE_PROFILE_NAME')
            end
          end
          project.save
          RUBY
      - name: Archivar aplicación con perfil de distribución
        working-directory: ios-build
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/TifloAcosta.xcarchive" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$API_ID" -authenticationKeyIssuerID "$API_ISSUER" archive
      - name: Verificar cifrado exento e iOS 15 en la app archivada
        run: |
          set -euo pipefail
          APP_PLIST="$RUNNER_TEMP/TifloAcosta.xcarchive/Products/Applications/App.app/Info.plist"
          test -f "$APP_PLIST" || { echo "::error::Falta Info.plist de la app archivada"; exit 1; }
          ENCRYPTION="$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP_PLIST")"
          MIN_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PLIST")"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          EXPECTED_BUILD="$((400000 + GITHUB_RUN_NUMBER))"
          LOCATION_PURPOSE="$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$APP_PLIST")"
          test "$ENCRYPTION" = false || { echo "::error::Falta declaración de cifrado exento"; exit 1; }
          test "$MIN_IOS" = 15.0 || { echo "::error::iOS mínimo incorrecto: $MIN_IOS"; exit 1; }
          test "$BUILD_VERSION" = "$EXPECTED_BUILD" || { echo "::error::Número de compilación incorrecto: $BUILD_VERSION (esperado $EXPECTED_BUILD)"; exit 1; }
          test -n "$LOCATION_PURPOSE" || { echo "::error::Falta explicación de uso de ubicación en Info.plist"; exit 1; }
          echo "Archivo iOS comprobado: compilación $BUILD_VERSION, cifrado exento, privacidad e iOS mínimo $MIN_IOS"
      - name: Configurar exportación App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string> 
            <key>signingCertificate</key><string>Apple Distribution</string> 
            <key>provisioningProfiles</key><dict><key>com.tifloacosta.app</key><string>PROFILE_REPLACEME</string><key>com.tifloacosta.app.ShareExtension</key><string>SHARE_PROFILE_REPLACEME</string></dict>
            <key>teamID</key><string>3A8G8A62YZ</string>
          </dict></plist>
          PLIST
          sed -i '' "s/SHARE_PROFILE_REPLACEME/$IOS_SHARE_PROFILE_NAME/g" "$RUNNER_TEMP/ExportOptions.plist"
          sed -i '' "s/PROFILE_REPLACEME/$IOS_PROFILE_NAME/g" "$RUNNER_TEMP/ExportOptions.plist"
      - name: Exportar IPA firmada
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TifloAcosta.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ios-export" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$API_ID" -authenticationKeyIssuerID "$API_ISSUER"
      - name: Enviar compilación a App Store Connect para TestFlight
        env:
          API_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA" || { echo "No se ha generado IPA"; exit 1; }
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_ID" --apiIssuer "$API_ISSUER"
      - name: Confirmar disponibilidad real en Apple TestFlight
        timeout-minutes: 26
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: node ios-build/check-testflight-ready.mjs
      - name: Borrar credencial privada del equipo temporal
        if: always()
        run: |
          if [ -n "${ASC_KEY_PATH:-}" ]; then rm -f "$ASC_KEY_PATH"; fi
