name: Capturas de auditoría visual iOS 1.7 sin distribución
on:
  workflow_dispatch:
  push:
    branches:
      - development/next-public-1.6-500200-20261121
    paths:
      - '.github/workflows/ios-visual-snapshot-audit.yml'
      - 'ios-app-native/VisualAudit/**'
permissions:
  contents: read
jobs:
  visual-snapshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Elegir Xcode 26
        run: |
          set -euo pipefail
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          test -n "$XCODE"
          sudo xcode-select --switch "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Preparar proyecto diagnóstico
        run: |
          set -euo pipefail
          brew install xcodegen
          cp ios-app-native/VisualAudit/VisualAuditTests.swift ios-app-native/LocalizationUITests/
          (cd ios-app-native && xcodegen generate --spec localization-audit-project.yml)
      - name: Iniciar simulador
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k in sorted(d,reverse=True) if "iOS" in k for v in d[k] if v.get("isAvailable") and v["name"].startswith("iPhone")))')"
          echo "AUDIT_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Compilar una sola vez sin firma
        run: |
          xcodebuild -project ios-app-native/TifloAcostaNative.xcodeproj \
            -scheme TifloAcostaLocalizationAudit -configuration Debug \
            -destination "platform=iOS Simulator,id=$AUDIT_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/visual-audit" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Capturar en claro, oscuro y texto ampliado
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-evidence"
          status=0
          for variant in light dark large; do
            appearance="$variant"
            test_method=testStandard
            if [ "$variant" = large ]; then
              appearance=light
              test_method=testLarge
            fi
            xcrun simctl ui "$AUDIT_DEVICE" appearance "$appearance"
            bundle="$RUNNER_TEMP/visual-evidence/$variant.xcresult"
            xcodebuild -project ios-app-native/TifloAcostaNative.xcodeproj \
              -scheme TifloAcostaLocalizationAudit -configuration Debug \
              -destination "platform=iOS Simulator,id=$AUDIT_DEVICE" \
              -derivedDataPath "$RUNNER_TEMP/visual-audit" \
              -resultBundlePath "$bundle" \
              -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
              "-only-testing:TifloAcostaLocalizationUITests/VisualAuditTests/$test_method" \
              test-without-building || status=1
            if [ -d "$bundle" ]; then
              mkdir -p "$RUNNER_TEMP/visual-evidence/$variant"
              xcrun xcresulttool export attachments --path "$bundle" \
                --output-path "$RUNNER_TEMP/visual-evidence/$variant" || status=1
              count=$(find "$RUNNER_TEMP/visual-evidence/$variant" -type f -iname '*.png' | wc -l)
              echo "$variant: $count PNG captures"
              if [ "$count" -lt 16 ]; then status=1; fi
            else
              status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-visual-audit-evidence
          path: ${{ runner.temp }}/visual-evidence
          if-no-files-found: warn
