name: iOS VoiceOver device-test build check
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-voiceover-build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-voiceover-build-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and run reader tests
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build
      - name: Generate iOS Capacitor project
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Check Xcode build for simulator
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Record device-verification requirement
        run: echo 'VoiceOver rotor actions, picker labels, focus, audio/DAISY and share sheet remain unverified until installed on a physical iPhone.'
