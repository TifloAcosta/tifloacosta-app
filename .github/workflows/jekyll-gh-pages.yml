# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fechar automaticamente los recursos nuevos
        shell: bash
        run: |
          set -euo pipefail
          node --test test/stamp-resource-news.test.mjs
          node scripts/stamp-resource-news.mjs
          if ! git diff --quiet -- data.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.js
            git commit -m 'chore: fecha de incorporacion de nuevos recursos'
            git push origin HEAD:main
          fi
      - name: Comprobar navegación básica y enlaces de la web
        run: node --test test/web-site-maintenance.test.mjs test/web-contact-identity.test.mjs test/clean-home.test.mjs test/regression.test.mjs test/pwa-startup.test.mjs
      - name: Install shared web build dependencies
        working-directory: mobile
        run: npm ci
      - name: Build shared web bridge
        run: node mobile/scripts/build-shared-web.mjs
      - name: Synchronize Actualidad
        run: node scripts/sync-actualidad.mjs
      - name: Synchronize Accessible apps
        run: node scripts/sync-actualidad-apps.mjs
      - name: Synchronize Multimedia
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-actualidad-media.mjs
      - name: Build mobile content feed
        run: node scripts/build-mobile-content.mjs
      - name: Comprobar que Novedades iOS y web comparten las publicaciones recientes
        run: node --test test/featured-news.test.mjs
      - name: Build video search index
        run: node scripts/build-video-search-index.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
