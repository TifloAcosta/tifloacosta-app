name: Migrate direct readers

on:
  push:
    paths:
      - '.github/workflows/migrate-direct-readers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Migrate English readers
        run: node scripts/migrate-readers.mjs --lang=en
      - name: Run regression tests
        run: npm test
      - name: Commit migrated readers
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "TifloAcosta automation"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add data.js docs/en
          git commit -m "content: migrate English direct readers"
          git push
