name: Migrar biblioteca fuera de Google Drive

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/migrate-drive-library.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "migrate-drive-library"
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Migrar documentos y enlaces de Drive
        run: node scripts/migrate-drive-library.mjs

      - name: Regenerar contenido móvil
        run: node scripts/build-mobile-content.mjs

      - name: Verificar que la biblioteca documental no depende de Drive
        run: |
          if grep -n "drive.google.com" data.js medical-studies.js; then
            echo "Quedan referencias documentales a Google Drive"
            exit 1
          fi

      - name: Guardar migración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js medical-studies.js mobile-content.json docs/es docs/en
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Migrar biblioteca documental a TifloAcosta"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy Pages
        uses: actions/deploy-pages@v5
