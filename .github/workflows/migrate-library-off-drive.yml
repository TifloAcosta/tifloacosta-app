name: Migrate library off Google Drive

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/migrate-library-off-drive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Replace Drive download URLs with local TifloAcosta HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data.js';
          let text = fs.readFileSync(path, 'utf8');
          const before = (text.match(/https:\/\/drive\.google\.com\//g) || []).length;
          text = text.replace(/"url":\s*"https:\/\/drive\.google\.com\/file\/d\/[^\"]+\/view\?usp=drivesdk",\s*\n\s*"openUrl":\s*"(https:\/\/tifloacosta\.com\/docs\/[^\"]+\.html(?:\?[^\"]*)?)"/g,
            (_, local) => `"url": "${local}",\n    "openUrl": "${local}"`);
          const after = (text.match(/https:\/\/drive\.google\.com\//g) || []).length;
          fs.writeFileSync(path, text);
          console.log(`Drive URLs in data.js: ${before} -> ${after}`);
          if (after !== 0) {
            console.error('Drive URLs remain in data.js');
            process.exit(1);
          }
          NODE
      - name: Build mobile content
        run: node scripts/build-mobile-content.mjs
      - name: Verify library catalog no longer depends on Drive
        run: |
          ! grep -n "drive.google.com" data.js
          ! grep -n "drive.google.com" mobile-content.json
      - name: Commit migration
        run: |
          if git diff --quiet -- data.js mobile-content.json; then
            echo "Nothing to migrate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js mobile-content.json
          git commit -m "Migrate resource downloads from Google Drive to TifloAcosta"
          git push
