name: Migrar tonos a TifloAcosta

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/build-local-ringtones.mjs"
      - ".github/workflows/migrate-ringtones.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "migrate-ringtones"
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar descargador de Drive
        run: python -m pip install --disable-pip-version-check gdown

      - name: Descargar colección completa de tonos
        run: |
          rm -rf .tone-import
          mkdir -p .tone-import
          gdown --folder "https://drive.google.com/drive/folders/1wfOpHewRIXds1MiQNv6TxJWOd8frNu50" -O .tone-import

      - name: Crear biblioteca local y páginas accesibles
        run: node scripts/build-local-ringtones.mjs

      - name: Verificar cantidades y ausencia de Drive en las páginas
        run: |
          test "$(find media/tones/general -type f | wc -l)" -eq 13
          test "$(find media/tones/nokia -type f | wc -l)" -eq 30
          test "$(find media/tones/iphone -type f | wc -l)" -eq 80
          if grep -n "drive.google.com" docs/es/tonos.html docs/en/ringtones.html; then
            echo "Las páginas de tonos siguen apuntando a Drive"
            exit 1
          fi

      - name: Guardar tonos en TifloAcosta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/tones docs/es/tonos.html docs/en/ringtones.html
          git commit -m "Alojar colección de tonos en TifloAcosta"
          git push
