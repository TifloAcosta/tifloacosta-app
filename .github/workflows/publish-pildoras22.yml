name: Publish Pildoras 22

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/publish-pildoras22.mjs"
      - ".github/workflows/publish-pildoras22.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verify local editions exist
        run: |
          test -s docs/es/pildoras-tecnologicas-22-2026.html
          test -s docs/en/technology-pills-22-2026.html
          test -s docs/en/technology-pills-22-part1.inc.html
          test -s docs/en/technology-pills-22-part2.inc.html
          test -s docs/en/technology-pills-22-part3.inc.html
          grep -q '<html lang="es"' docs/es/pildoras-tecnologicas-22-2026.html
          grep -q '<html lang="en"' docs/en/technology-pills-22-2026.html
      - name: Update resource catalog
        run: node scripts/publish-pildoras22.mjs
      - name: Verify catalog
        run: |
          grep -q "Píldoras 22 2026" data.js
          grep -q "Tech Pills 22 2026" data.js
      - name: Run tests
        run: node --test
      - name: Remove one-shot publication files
        run: |
          rm scripts/publish-pildoras22.mjs
          rm .github/workflows/publish-pildoras22.yml
      - name: Commit publication
        run: |
          git config user.name "TifloAcosta automation"
          git config user.email "146574974+TifloAcosta@users.noreply.github.com"
          git add -A
          git commit -m "content: publish Pildoras 22 in Spanish and English"
          git push origin main
