name: Registrar identificador Compartir en Apple sin publicar
on:
  push:
    branches: [feature/ios-compartir-nativo-20261016]
    paths:
      - 'ios-build/apple-share-registration-20261016.request'
permissions:
  contents: read
jobs:
  apple-identifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registrar identificador de la extensión y verificar capacidades
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          node --check ios-build/register-share-bundle.mjs
          node ios-build/register-share-bundle.mjs
