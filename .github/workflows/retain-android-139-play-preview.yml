name: Keep private direct-download link for Google Play signed APK
on:
  push:
    branches:
      - fix/android-139-production-native-entry-20261030
    paths:
      - mobile/release/retain-apk-preview.once
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: TifloAcosta/tifloacosta-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify explicit marker
        run: |
          set -euo pipefail
          grep -Fxq 'retain GooglePlay signed 1.3.9 APK from verified run 41058205461 as private GitHub draft' mobile/release/retain-apk-preview.once
      - name: Download signed artifact from verified staging run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download 41058205461 --name 'TifloAcosta-1.3.9-GooglePlay-firmada-sin-publicar' --dir "$RUNNER_TEMP/apk"
          apk="$(find "$RUNNER_TEMP/apk" -type f -name 'TifloAcosta-Android-1.3.9-code*-GooglePlay.apk' -print -quit)"
          test -n "$apk"
          python3 -c 'import json,sys,hashlib,pathlib; p=pathlib.Path(sys.argv[1]); d=json.load(open(sys.argv[2])); assert d["published"] is False and d["status"] == "draft" and d["versionName"]=="1.3.9" and d["sourceCommit"]=="41905966ea4fc53e9dcaf51e36a4c712a2a5d545"; assert p.name==d["apkFile"]; assert hashlib.sha256(p.read_bytes()).hexdigest()==d["playSignedApkSha256"]' "$apk" "$RUNNER_TEMP/apk/Google-Play-draft-info.json"
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
      - name: Create private GitHub draft release with uncompressed APK
        shell: bash
        run: |
          set -euo pipefail
          tag='tifloacosta-android-1.3.9-googleplay-preview'
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target 41905966ea4fc53e9dcaf51e36a4c712a2a5d545 \
              --title 'TifloAcosta 1.3.9 - APK firmada por Google Play (comprobación privada)' \
              --notes 'Archivo de comprobación. NO es una publicación para los usuarios. Descarga el APK sin descomprimirlo; versión en borrador de Google Play. No borrar los datos de la aplicación anterior.'
          fi
          gh release upload "$tag" "$APK_FILE" --clobber
          echo 'Draft release: https://github.com/TifloAcosta/tifloacosta-app/releases/tag/tifloacosta-android-1.3.9-googleplay-preview'
