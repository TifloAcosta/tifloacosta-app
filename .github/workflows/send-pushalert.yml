name: Send PushAlert notification

on:
  push:
    branches: ["main"]
    paths:
      - 'push/queue/*.json'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find newly queued notifications
        id: queue
        shell: bash
        run: |
          files="$(git diff --diff-filter=A --name-only HEAD^ HEAD -- 'push/queue/*.json' | tr '\n' ' ')"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Send queued notifications
        if: steps.queue.outputs.files != ''
        env:
          PUSHALERT_API_KEY: ${{ secrets.PUSHALERT_API_KEY }}
        shell: bash
        run: |
          for file in ${{ steps.queue.outputs.files }}; do
            node scripts/send-pushalert.mjs "$file"
          done
