name: Sync Actualidad TifloAcosta

on:
  push:
    branches:
      - feature/actualidad-web
    paths:
      - 'actualidad-sources.json'
      - 'actualidad-editorial.json'
      - 'scripts/actualidad-*.mjs'
      - 'scripts/sync-actualidad.mjs'
      - '.github/workflows/sync-actualidad.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize Actualidad
        run: node scripts/sync-actualidad.mjs

      - name: Run tests
        run: npm test

      - name: Detect Actualidad changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- actualidad.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Actualidad
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad.json
          git commit -m "chore: sync Actualidad"
          git push

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        if: steps.changes.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
