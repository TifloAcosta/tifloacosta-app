name: Sync Actualidad TifloAcosta

on:
  push:
    branches:
      - main
      - 'feature/actualidad-*'
    paths:
      - 'actualidad-core.js'
      - 'actualidad-sources.json'
      - 'actualidad-discovery-sources.json'
      - 'actualidad-editorial.json'
      - 'actualidad-auto-config.json'
      - 'actualidad-auto-state.json'
      - 'docs/actualidad-editorial-guidelines.md'
      - 'actualidad-media-sources.json'
      - 'actualidad-media-editorial.json'
      - 'scripts/actualidad-*.mjs'
      - 'scripts/openai-actualidad-client.mjs'
      - 'scripts/sync-actualidad.mjs'
      - 'scripts/sync-actualidad-apps.mjs'
      - 'scripts/sync-actualidad-media.mjs'
      - 'scripts/validate-actualidad-discovery.mjs'
      - 'test/actualidad-auto-*.test.mjs'
      - 'test/openai-actualidad-client.test.mjs'
      - 'test/actualidad-media-*.test.mjs'
      - 'docs/actualidad-multimedia-candidates.md'
      - '.github/workflows/sync-actualidad.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-sources:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize Actualidad and require every source
        shell: bash
        run: |
          set -o pipefail
          output="$(node scripts/sync-actualidad.mjs 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'Actualidad sources unavailable:' <<< "$output"; then
            echo 'One or more configured Actualidad sources are unavailable during validation.' >&2
            exit 1
          fi

      - name: Validate discovery sources
        run: node scripts/validate-actualidad-discovery.mjs

      - name: Synchronize Accessible apps
        run: node scripts/sync-actualidad-apps.mjs

      - name: Synchronize Multimedia and require every source
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          output="$(node scripts/sync-actualidad-media.mjs 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'Multimedia source unavailable:' <<< "$output"; then
            echo 'One or more configured multimedia sources are unavailable during validation.' >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

  sync-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize Actualidad
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/sync-actualidad.mjs

      - name: Synchronize Accessible apps
        run: node scripts/sync-actualidad-apps.mjs

      - name: Synchronize Multimedia
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-actualidad-media.mjs

      - name: Run tests
        run: npm test

      - name: Detect Actualidad changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- actualidad.json actualidad-apps.json actualidad-media.json actualidad-editorial.json actualidad-auto-state.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Actualidad
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualidad.json actualidad-apps.json actualidad-media.json actualidad-editorial.json actualidad-auto-state.json
          git commit -m "chore: sync Actualidad"
          git push

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
