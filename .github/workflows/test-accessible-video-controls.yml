name: Test accessible video controls

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'videos.html'
      - 'videos.js'
      - 'test/video-player-controls.test.mjs'
      - '.github/workflows/test-accessible-video-controls.yml'
  pull_request:
    paths:
      - 'videos.html'
      - 'videos.js'
      - 'test/video-player-controls.test.mjs'
      - '.github/workflows/test-accessible-video-controls.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check video JavaScript syntax
        run: node --check videos.js
      - name: Run repository tests
        run: npm test
