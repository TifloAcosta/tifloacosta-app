name: Test clean home navigation

on:
  push:
    branches:
      - 'feature/home-clean-block-navigation'
      - 'fix/search-podcast-categories'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize TifloAcosta podcast for search verification
        run: node scripts/sync-podcast.mjs
      - run: npm test
      - name: Diagnose the reported calor episode
        run: node -e "const fs=require('fs'); const items=JSON.parse(fs.readFileSync('podcast.json','utf8')); const hits=items.filter(item=>/(calor|gusta|verano|fr[ií]o)/i.test(String(item.title||''))); console.log(hits.map(item=>item.title).join('\n') || 'No related titles found'); if(!items.some(item=>/calor/i.test(String(item.title||'')))) process.exit(1);"
