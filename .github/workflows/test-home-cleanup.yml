name: Test clean home navigation

on:
  push:
    branches:
      - 'feature/home-clean-block-navigation'
      - 'fix/search-podcast-categories'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize TifloAcosta podcast for search verification
        run: node scripts/sync-podcast.mjs
      - run: npm test
      - name: Find the reported calor episode in approved podcast feeds
        run: |
          node - <<'NODE'
          const fs = require('fs');
          (async () => {
            const sources = JSON.parse(fs.readFileSync('actualidad-media-sources.json', 'utf8'))
              .filter(source => source.enabled && source.type === 'audio' && source.adapter === 'feed' && source.endpoint);
            let found = false;
            for (const source of sources) {
              try {
                const response = await fetch(source.endpoint);
                console.log(`FEED ${source.name} HTTP ${response.status}`);
                if (!response.ok) continue;
                const xml = await response.text();
                const titles = [...xml.matchAll(/<title(?:\s[^>]*)?>([\s\S]*?)<\/title>/gi)]
                  .map(match => match[1].replace(/<!\[CDATA\[|\]\]>/g, '').replace(/<[^>]+>/g, '').trim())
                  .filter(title => /calor/i.test(title));
                for (const title of titles) console.log(`MATCH ${source.name}: ${title}`);
                if (titles.length) found = true;
              } catch (error) {
                console.log(`ERROR ${source.name}: ${error.message}`);
              }
            }
            if (!found) process.exit(1);
          })();
          NODE
