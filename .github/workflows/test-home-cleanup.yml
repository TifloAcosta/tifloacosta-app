name: Test clean home navigation

on:
  push:
    branches:
      - 'feature/home-clean-block-navigation'
      - 'fix/search-podcast-categories'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
