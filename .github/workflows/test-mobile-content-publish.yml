name: Test mobile content publish

on:
  push:
    branches:
      - feat/publish-mobile-content

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test mobile feed generator
        run: node --test test/mobile-content.test.mjs
      - name: Run repository regression tests
        run: npm test
