name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run mobile foundation tests
        run: |
          node --test test/actualidad-core.test.mjs
          node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
          node --test mobile/test/*.test.mjs
