name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run Leer con TifloAcosta beta acceptance gate
        working-directory: mobile
        run: npm run test:reading-beta
      - name: Run actualidad core tests
        run: node --test test/actualidad-core.test.mjs
      - name: Run mobile content tests
        run: node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
      - name: Run isolated mobile tests 1 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=0
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 2 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 3 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((2*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 4 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((3*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 5 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((4*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 6 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((5*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 7 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((6*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
      - name: Run isolated mobile tests 8 of 8
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((7*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; node --test "$test_file"; done
