name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
      - '.github/scripts/run-mobile-test-shard.sh'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
      - '.github/scripts/run-mobile-test-shard.sh'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build shared web bridge
        run: node mobile/scripts/build-shared-web.mjs
      - name: Run Leer con TifloAcosta beta acceptance gate
        working-directory: mobile
        run: npm run test:reading-beta
      - name: Run actualidad core tests
        run: node --test test/actualidad-core.test.mjs
      - name: Run mobile content tests
        run: node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
      - name: Run isolated mobile tests 1 of 32
        run: bash .github/scripts/run-mobile-test-shard.sh 0 32
      - name: Run isolated mobile tests 2 of 32
        run: bash .github/scripts/run-mobile-test-shard.sh 1 32
      - name: Run isolated mobile tests 3 of 32
        run: bash .github/scripts/run-mobile-test-shard.sh 2 32
