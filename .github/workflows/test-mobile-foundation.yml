name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run Leer con TifloAcosta beta acceptance gate
        working-directory: mobile
        run: npm run test:reading-beta
      - name: Run actualidad core tests
        run: node --test test/actualidad-core.test.mjs
      - name: Run mobile content tests
        run: node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
      - name: Run changed general mobile tests
        run: >-
          node --test
          mobile/test/home.test.mjs
          mobile/test/privacy-screen.test.mjs
          mobile/test/shared-screen-header-layout.test.mjs
          mobile/test/visual-action-grouping.test.mjs
          mobile/test/visual-layout-contract.test.mjs
      - name: Run changed TifloLector tests
        run: >-
          node --test
          mobile/test/reading-android-native-contract.test.mjs
          mobile/test/reading-background-speech-controller.test.mjs
          mobile/test/reading-background-tts-contract.test.mjs
          mobile/test/reading-background-tts-js-bridge.test.mjs
          mobile/test/reading-background-tts-plugin-contract.test.mjs
          mobile/test/reading-background-tts-service-contract.test.mjs
          mobile/test/reading-derived-contract.test.mjs
          mobile/test/reading-integration-contract.test.mjs
          mobile/test/reading-native-active-book-context.test.mjs
          mobile/test/reading-settings-screen.test.mjs
          mobile/test/reading-speech.test.mjs
          mobile/test/reading-tts-media-session-contract.test.mjs
          mobile/test/reading-voice-catalog.test.mjs
      - name: Diagnostic mobile tests quarter 1
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}
          q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:0:q}"
      - name: Diagnostic mobile tests quarter 2
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}
          q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:q:q}"
      - name: Diagnostic mobile tests quarter 3
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}
          q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:2*q:q}"
      - name: Diagnostic mobile tests quarter 4
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}
          q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:3*q:q}"
      - name: Run mobile application tests
        run: node --test --test-concurrency=1 mobile/test/*.test.mjs
