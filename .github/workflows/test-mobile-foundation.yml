name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run Leer con TifloAcosta beta acceptance gate
        working-directory: mobile
        run: npm run test:reading-beta
      - name: Run actualidad core tests
        run: node --test test/actualidad-core.test.mjs
      - name: Run mobile content tests
        run: node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
      - name: Diagnostic quarters 1 2 3
        continue-on-error: true
        shell: bash
        run: |
          git restore .
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:0:3*q}"
      - name: Diagnostic quarters 1 2 4
        continue-on-error: true
        shell: bash
        run: |
          git restore .
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:0:2*q}" "${tests[@]:3*q:q}"
      - name: Diagnostic quarters 1 3 4
        continue-on-error: true
        shell: bash
        run: |
          git restore .
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:0:q}" "${tests[@]:2*q:2*q}"
      - name: Diagnostic quarters 2 3 4
        continue-on-error: true
        shell: bash
        run: |
          git restore .
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; q=$(( (n + 3) / 4 ))
          node --test --test-concurrency=1 "${tests[@]:q}"
      - name: Run mobile application tests
        shell: bash
        run: |
          git restore .
          node --test --test-concurrency=1 mobile/test/*.test.mjs
