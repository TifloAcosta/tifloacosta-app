name: Test mobile foundation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'test/mobile-content-retention.test.mjs'
      - 'actualidad-core.js'
      - 'test/actualidad-core.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/bootstrap-mobile-android.yml'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run Leer con TifloAcosta beta acceptance gate
        working-directory: mobile
        run: npm run test:reading-beta
      - name: Run actualidad core tests
        run: node --test test/actualidad-core.test.mjs
      - name: Run mobile content tests
        run: node --test test/mobile-content.test.mjs test/mobile-content-retention.test.mjs
      - name: Diagnose octant 3 part 1
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); p=$(( (s + 3) / 4 )); start=$((2*s))
          chunk=("${tests[@]:start:p}")
          printf 'Testing %s\n' "${chunk[@]}"
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; echo "Running ${test_file}"; node --test "$test_file"; done
      - name: Diagnose octant 3 part 2
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); p=$(( (s + 3) / 4 )); start=$((2*s+p))
          chunk=("${tests[@]:start:p}")
          printf 'Testing %s\n' "${chunk[@]}"
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; echo "Running ${test_file}"; node --test "$test_file"; done
      - name: Diagnose octant 3 part 3
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); p=$(( (s + 3) / 4 )); start=$((2*s+2*p))
          chunk=("${tests[@]:start:p}")
          printf 'Testing %s\n' "${chunk[@]}"
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; echo "Running ${test_file}"; node --test "$test_file"; done
      - name: Diagnose octant 3 part 4
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); p=$(( (s + 3) / 4 )); start=$((2*s+3*p)); end=$((3*s))
          count=$(( end > start ? end - start : 0 ))
          chunk=("${tests[@]:start:count}")
          printf 'Testing %s\n' "${chunk[@]}"
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; echo "Running ${test_file}"; node --test "$test_file"; done
      - name: Recheck octant 3
        shell: bash
        run: |
          mapfile -t tests < <(find mobile/test -maxdepth 1 -name '*.test.mjs' | sort)
          n=${#tests[@]}; s=$(( (n + 7) / 8 )); start=$((2*s))
          chunk=("${tests[@]:start:s}")
          for test_file in "${chunk[@]}"; do git restore .; git clean -fd; echo "Running ${test_file}"; node --test "$test_file"; done
