name: Test mobile foundation

on:
  push:
    branches:
      - feature/mobile-capacitor-foundation
  pull_request:
    paths:
      - 'scripts/build-mobile-content.mjs'
      - 'test/mobile-content.test.mjs'
      - 'mobile/**'
      - '.gitignore'
      - '.github/workflows/test-mobile-foundation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run mobile content test
        run: node --test test/mobile-content.test.mjs
