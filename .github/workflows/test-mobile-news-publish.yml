name: Test mobile news publish

on:
  push:
    branches:
      - feat/publish-mobile-news

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test mobile feed generator
        run: node --test test/mobile-content.test.mjs
      - name: Generate mobile feed with real catalogs
        run: node scripts/build-mobile-content.mjs
      - name: Verify real mobile news
        run: node -e "const f=require('./mobile-content.json'); if (!Array.isArray(f.news) || f.news.length === 0) process.exit(1); console.log('Mobile news:', f.news.length)"
      - name: Run repository regression tests
        run: npm test
