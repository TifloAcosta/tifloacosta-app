name: Test novedades recientes

on:
  push:
    branches:
      - fix/novedades-recientes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/featured-news.test.mjs
