name: Test novedades recientes

on:
  push:
    branches:
      - fix/novedades-recientes

jobs:
  novedades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >-
          node --test
          test/featured-news.test.mjs
          test/regression.test.mjs
          test/install-analytics.test.mjs
          test/global-search.test.mjs
          test/mobile-content.test.mjs
          test/mobile-content-retention.test.mjs
          test/no-google-drive-library.test.mjs
