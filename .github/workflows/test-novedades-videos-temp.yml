name: Test Novedades videos temp

on:
  push:
    branches:
      - feat/novedades-videos
  workflow_dispatch:

jobs:
  test-novedades-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app-core.js
          node --check news-videos.js
          node --check videos-core.js
          node --check video-deeplink.js
      - name: Run relevant tests
        run: |
          node --test \
            test/featured-news.test.mjs \
            test/news-videos-integration.test.mjs \
            test/video-player-controls.test.mjs \
            test/video-search.test.mjs \
            test/regression.test.mjs \
            test/install-analytics.test.mjs \
            test/global-search.test.mjs \
            test/mobile-content.test.mjs \
            test/mobile-content-retention.test.mjs \
            test/no-google-drive-library.test.mjs
