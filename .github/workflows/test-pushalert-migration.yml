name: Test PushAlert migration

on:
  push:
    paths:
      - 'test/pushalert-migration.test.mjs'
      - 'index.html'
      - 'app.js'
      - 'notifications.js'
      - 'pushalert-config.js'
      - 'pushalert-worker.js'
      - 'sw.js'
      - 'scripts/send-pushalert.mjs'
      - '.github/workflows/send-pushalert.yml'
      - '.github/workflows/test-pushalert-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/pushalert-migration.test.mjs
