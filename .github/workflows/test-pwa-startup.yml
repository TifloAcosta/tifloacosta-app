name: Test PWA startup resilience

on:
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'sw.js'
      - 'test/pwa-startup.test.mjs'
      - '.github/workflows/test-pwa-startup.yml'
  pull_request:
    paths:
      - 'sw.js'
      - 'test/pwa-startup.test.mjs'
      - '.github/workflows/test-pwa-startup.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sw.js
      - run: npm test
