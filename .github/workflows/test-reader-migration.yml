name: Test reader migration

on:
  push:
    paths:
      - 'test/reader-migration.test.mjs'
      - 'test/install-analytics.test.mjs'
      - 'test/regression.test.mjs'
      - 'scripts/migrate-readers.mjs'
      - 'index.html'
      - 'notifications.js'
      - 'sw.js'
      - 'app.js'
      - 'push/**'
      - '.github/workflows/test-reader-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
