name: Test repository changes

on:
  push:
    paths:
      - 'test/**'
      - 'scripts/**'
      - 'mobile/**'
      - 'package.json'
      - '.github/workflows/test-reader-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run root tests
        run: npm test
      - name: Install mobile dependencies
        if: hashFiles('mobile/package.json') != ''
        working-directory: mobile
        run: npm install
      - name: Run mobile tests
        if: hashFiles('mobile/package.json') != ''
        working-directory: mobile
        run: npm test
