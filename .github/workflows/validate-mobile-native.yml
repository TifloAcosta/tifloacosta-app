name: Validate mobile native builds

on:
  push:
    branches:
      - feature/mobile-native-integrations-work
    paths:
      - 'mobile/**'
      - '.github/workflows/validate-mobile-native.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ONESIGNAL_DISABLE_LOCATION: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build and sync Android
        working-directory: mobile
        run: |
          npm run build
          npx cap sync android
      - name: Compile Android debug app
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build and sync iOS
        working-directory: mobile
        run: |
          npm run build
          npx cap sync ios
      - name: Compile iOS simulator app
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
