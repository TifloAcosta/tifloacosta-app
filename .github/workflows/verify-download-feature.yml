name: Verify download feature

on:
  push:
    branches:
      - 'feature/download-from-link'
    paths:
      - '.github/workflows/verify-download-feature.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
