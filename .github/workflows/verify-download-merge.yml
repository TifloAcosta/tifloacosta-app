name: Verify merged download feature

on:
  push:
    branches:
      - 'verify/download-merge-2026-09-18'
    paths:
      - '.github/workflows/verify-download-merge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
