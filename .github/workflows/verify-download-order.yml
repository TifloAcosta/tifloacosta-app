name: Verify download launcher order

on:
  push:
    branches:
      - 'fix/download-before-videos'
    paths:
      - '.github/workflows/verify-download-order.yml'
      - 'downloads.js'
      - 'test/downloads-surface.test.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
