apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.tifloacosta.nativeprototype'
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
    }
    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs '../app/src/main/java'
            res.srcDirs '../app/src/main/res'
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}
// This shared library has JVM unit tests in the prototype but no device-side
// instrumentation tests. Disable only its empty androidTest variants: running
// their dex transform needlessly processes POI MethodHandle APIs that require
// Android 26, even though production deliberately supports API 24/25.
// Keep app instrumentation tests and the library's JVM tests enabled.
// This is NOT proof that an unminified release AAB is compatible with API 24.
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.enableAndroidTest = false
    }
}

kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.12.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    // Compatibility candidate only: POI 5.x includes MethodHandle.invoke
    // instructions that Android D8 rejects for API 24/25. POI 4.1.2 has
    // a known HMEF/TNEF issue (CVE-2022-26336): do NOT distribute until
    // shrinker/dependency/security review confirms HMEF cannot be reached.
    // TifloLector must accept only the four OLE2 formats checked in
    // NativeReaderLegacyOffice, with strict input/memory limits.
    implementation('org.apache.poi:poi:4.1.2') {
        exclude group: 'log4j', module: 'log4j'
    }
    implementation('org.apache.poi:poi-scratchpad:4.1.2') {
        exclude group: 'log4j', module: 'log4j'
    }
    // POI's legacy slideshow binding references JAXB annotations that Android
    // does not provide. Supply the actual API instead of suppressing R8 errors.
    // This is a build-compatibility experiment, not release approval for POI 4.1.2.
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:8.1.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
