# Diagnostic-only project configuration, never used for TestFlight.
include:
  - project.yml
# Diagnostic simulator bundles must have matching, nonempty version metadata.
# Distribution continues to supply its own version/build number independently.
settings:
  base:
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TifloAcostaLocalizationUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LocalizationUITests
    dependencies:
      - target: TifloAcostaNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tifloacosta.app.LocalizationUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TifloAcostaNative
        CODE_SIGNING_ALLOWED: NO
schemes:
  TifloAcostaLocalizationAudit:
    build:
      targets:
        TifloAcostaNative: all
        TifloAcostaLocalizationUITests: [test]
    test:
      targets:
        - TifloAcostaLocalizationUITests
