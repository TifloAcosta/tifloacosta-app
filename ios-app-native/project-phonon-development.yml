name: TifloAcostaPhononDevelopment
options:
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  SwiftMP3:
    url: https://github.com/mierau/swift-mp3.git
    from: 1.0.0
  Phonon:
    url: https://github.com/gradium-ai/xn-ptts.git
    exactVersion: 0.4.1
targets:
  TifloAcostaNative:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tifloacosta.app.phonon.development
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "TifloAcosta"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tifloacosta.app
    dependencies:
      - target: TifloAcostaShare
      - package: ZIPFoundation
      - package: SwiftMP3
      - package: Phonon
        product: ptts
  TifloAcostaShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension/ShareViewController.swift
      - path: ShareExtension/ShareReadingPreview.swift
    # Keep the source-controlled plist intact: XcodeGen info.path would regenerate it,
    # removing NSExtensionPointIdentifier and making App Store Connect reject the IPA.
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tifloacosta.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tifloacosta.app.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: ZIPFoundation
