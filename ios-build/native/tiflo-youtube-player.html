<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>TifloReproductor · YouTube</title>
  <style>
    html,body,#player { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    iframe { display:block; width:100%; height:100%; border:0; }
  </style>
</head>
<body>
<div id="player"></div>
<script>
(() => {
  'use strict';
  // The only runtime interpolation is a YouTube ID validated in Swift.
  const videoId = '__TIFLO_YOUTUBE_VIDEO_ID__';
  let player = null;
  let ready = false;
  let reportedError = false;
  let lastState = -1;
  function notify(type, fields = {}) {
    try { window.webkit.messageHandlers.tifloPlayer.postMessage({ type, ...fields }); }
    catch {}
  }
  function report() {
    if (!ready || !player || reportedError) return;
    try {
      const duration = Number(player.getDuration()) || 0;
      const position = Number(player.getCurrentTime()) || 0;
      const state = Number(player.getPlayerState());
      notify('progress', {
        duration: Number.isFinite(duration) ? Math.max(0, duration) : 0,
        position: Number.isFinite(position) ? Math.max(0, position) : 0,
        state: Number.isFinite(state) ? state : -1
      });
    } catch {}
  }
  // Native WKWebView calls only these fixed, validated commands.
  window.tifloControl = function(command, seconds) {
    if (!ready || !player || reportedError) return false;
    try {
      switch (command) {
        case 'play': player.playVideo(); break;
        case 'pause': player.pauseVideo(); break;
        case 'seek':
          if (!Number.isFinite(seconds)) return false;
          player.seekTo(Math.min(Math.max(seconds, 0), Math.max(0, player.getDuration() || 0)), true);
          break;
        case 'report': break;
        default: return false;
      }
      report();
      return true;
    } catch {
      return false;
    }
  };
  window.onYouTubeIframeAPIReady = () => {
    try {
      player = new YT.Player('player', {
        videoId,
        width: '100%',
        height: '100%',
        playerVars: { playsinline: 1, rel: 0, enablejsapi: 1, origin: location.origin },
        events: {
          onReady: () => { ready = true; notify('ready'); report(); },
          onStateChange: event => {
            lastState = Number(event.data);
            notify('state', { state: lastState });
            report();
          },
          onError: event => {
            reportedError = true;
            notify('error', { code: Number(event.data) || 0 });
          },
          onAutoplayBlocked: () => notify('blocked')
        }
      });
    } catch { notify('error', { code: 0 }); }
  };
  const loader = document.createElement('script');
  loader.src = 'https://www.youtube.com/iframe_api';
  loader.onerror = () => notify('error', { code: 0 });
  document.head.appendChild(loader);
  setInterval(report, 1500);
})();
</script>
</body>
</html>
